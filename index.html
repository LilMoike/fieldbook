<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fieldbook: quote, job, invoice and payment tracking for small trades and service businesses.">
<meta name="theme-color" content="#18232b">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Fieldbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field binder. Dark header band with tabs (bottom bar on phones), ledger-style rows,
   and each quote / work order / invoice opens as a paper form from a tear-off pad in a side sheet. */
:root{
  --paper:#eceee9; --surface:#fbfbf8; --sunk:#e2e5de; --ink:#18232b; --ink-2:#56636b; --line:#cfd5cc;
  --bar:#18232b; --bar-ink:#eef0ea; --bar-mute:#9fadb5;
  --accent:#c2410c; --accent-ink:#ffffff; --hl:#fff1a8;
  --ok:#2f7d3b; --ok-bg:#dcefdc; --info:#1d5f9e; --info-bg:#dde9f5;
  --warn:#8f5400; --warn-bg:#f8e8c8; --bad:#b42323; --bad-bg:#f6dcdc; --mute:#56636b; --mute-bg:#e2e5de;
  --shadow:rgba(20,28,34,.22); --scrim:rgba(12,17,21,.45);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161a; --surface:#192026; --sunk:#222a31; --ink:#e6eae4; --ink-2:#9ba7ad; --line:#2f3a42;
  --bar:#0b0f12; --bar-ink:#e6eae4; --bar-mute:#8795a0;
  --accent:#ff8a4c; --accent-ink:#1d0c02; --hl:#3d3718;
  --ok:#7bd88a; --ok-bg:#1c3322; --info:#8cc4f5; --info-bg:#172a3b;
  --warn:#f5b85c; --warn-bg:#3a2a12; --bad:#ff8f8f; --bad-bg:#3d1c1c; --mute:#9ba7ad; --mute-bg:#262e35;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161a; --surface:#192026; --sunk:#222a31; --ink:#e6eae4; --ink-2:#9ba7ad; --line:#2f3a42;
  --bar:#0b0f12; --bar-ink:#e6eae4; --bar-mute:#8795a0;
  --accent:#ff8a4c; --accent-ink:#1d0c02; --hl:#3d3718;
  --ok:#7bd88a; --ok-bg:#1c3322; --info:#8cc4f5; --info-bg:#172a3b;
  --warn:#f5b85c; --warn-bg:#3a2a12; --bad:#ff8f8f; --bad-bg:#3d1c1c; --mute:#9ba7ad; --mute-bg:#262e35;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
.muted{color:var(--ink-2)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--bar);color:var(--bar-ink)}
.top-in{display:flex;align-items:center;gap:12px 20px;padding-block:14px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;flex:1;min-width:0}
.logo{display:inline-flex;align-items:center;gap:10px;font:700 26px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.logo i{display:inline-block;width:12px;height:22px;background:var(--accent);border-radius:2px 2px 0 0;transform:translateY(2px)}
.biz{font-size:13px;color:var(--bar-mute)}
.demo{font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--bar-ink);border:1px solid var(--bar-mute);border-radius:999px;padding:4px 8px}
.tabs-in{display:flex;gap:4px}
.tab{position:relative;display:inline-flex;align-items:center;gap:8px;padding:10px 12px 12px;color:var(--bar-mute);text-decoration:none;font:600 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.tab:hover{color:var(--bar-ink)}
.tab.on{color:var(--bar-ink)}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--accent);border-radius:2px 2px 0 0}
.tab svg{display:none}
.badge{font:600 11px/1 var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 6px;letter-spacing:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1 var(--f-body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:transparent}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--r);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn svg,.btn svg{width:18px;height:18px}

/* main */
main{padding-block:24px 56px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font:700 36px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--ink-2)}
.sec{font:600 14px/1 var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}

.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:20px 0 32px;padding:0;list-style:none}
.flow li{position:relative;display:flex}
.flow li:not(:last-child)::after{content:"";position:absolute;right:-15px;top:50%;width:9px;height:9px;border-top:2px solid var(--ink-2);border-right:2px solid var(--ink-2);transform:translateY(-50%) rotate(45deg);opacity:.6}
.stage{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit;min-width:0}
.stage:hover{border-color:var(--ink-2)}
.stage-k{display:flex;gap:8px;align-items:center;font:600 13px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.stage-k b{font:500 11px/1 var(--f-mono);color:var(--accent);letter-spacing:0}
.stage-v{font:600 32px/1.1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stage-s{font-size:13px;color:var(--ink-2)}

.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px;align-items:start}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list + .sec{margin-top:28px}
.empty{padding:28px 18px;color:var(--ink-2);text-align:center}

.att{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.att:first-child{border-top:0}
.att-text{min-width:0}
.att .amt{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}

.jrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.jrow:first-child{border-top:0}
.jrow:hover,.row:hover{background:var(--sunk)}
.datebox{display:flex;flex-direction:column;align-items:center;justify-content:center;height:52px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.datebox b{font:700 22px/1 var(--f-display)}
.datebox small{font:600 10px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.jrow strong,.row strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jrow small,.row small{display:block;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .mono{font-size:12px;color:inherit;opacity:.75}

.row{display:grid;grid-template-columns:86px minmax(0,1fr) 90px 104px 120px;grid-template-areas:"num main date pill amt";align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.c-num{grid-area:num;font:500 13px var(--f-mono);color:var(--ink-2)}
.c-main{grid-area:main;min-width:0}
.c-date{grid-area:date;font-size:13px;color:var(--ink-2)}
.c-pill{grid-area:pill}
.c-amt{grid-area:amt;text-align:right;font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.c-amt small{font-family:var(--f-body)}
.row.client{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 80px 120px;grid-template-areas:"main date num amt"}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font:600 12px/1.6 var(--f-body);letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{color:var(--ok);background:var(--ok-bg)}
.t-info{color:var(--info);background:var(--info-bg)}
.t-warn{color:var(--warn);background:var(--warn-bg)}
.t-bad{color:var(--bad);background:var(--bad-bg)}
.t-mute{color:var(--mute);background:var(--mute-bg)}

.foot{padding-block:8px 40px;color:var(--ink-2);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(800px,100%);background:var(--paper);z-index:50;display:flex;flex-direction:column;box-shadow:-16px 0 48px var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-bar{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.sb-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:600 15px var(--f-mono)}
.sb-sub{margin-left:auto;font-size:13px;color:var(--ink-2);text-align:right}
.sheet-body{flex:1;overflow-y:auto;padding:20px 20px 32px;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .spacer{flex:1}

.paper{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:30px 28px 26px;box-shadow:0 14px 28px -22px var(--shadow)}
.paper::before{content:"";position:absolute;left:10px;right:10px;top:9px;height:6px;background:radial-gradient(circle,var(--paper) 2.5px,transparent 3px) 0 0/12px 6px repeat-x}
.paper-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.from-name{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.docid{text-align:right;margin-left:auto}
.doc-label{font:700 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.doc-num{font-size:15px;margin-top:4px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 24px;padding:16px 0;border-bottom:1px solid var(--line)}
.lbl{display:block;font:600 11px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.f{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 2px}
.f:hover{border-bottom-color:var(--ink-2)}
.f:focus{outline:none;border-bottom-color:var(--accent);background:var(--hl)}
select.f{cursor:pointer}
textarea.f{border:1px solid var(--line);border-radius:4px;min-height:76px;resize:vertical;padding:8px 10px;line-height:1.45}
.f.title{font:600 24px/1.2 var(--f-display);letter-spacing:.01em}
.doc-title{font:600 24px/1.2 var(--f-display);margin:0;text-wrap:balance}
.title-wrap{padding:16px 0 4px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.items{margin-top:14px}
.items-h,.item{display:grid;grid-template-columns:minmax(0,1fr) 100px 58px 62px 80px 92px 30px;gap:8px;align-items:center}
.items-h{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding-bottom:8px;border-bottom:1px solid var(--ink)}
.items-h .r,.item .amt{text-align:right}
.item{padding:4px 0;border-bottom:1px dashed var(--line)}
.item .f{border-bottom-color:transparent}
.item .f:hover{border-bottom-color:var(--line)}
.item .f:focus{border-bottom-color:var(--accent)}
.f.num{text-align:right;font-family:var(--f-mono);font-size:14px}
.item .amt{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.add-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.pb-label{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}

.ro-wrap{overflow-x:auto;margin-top:14px}
.ro{width:100%;border-collapse:collapse;font-size:14px}
.ro th{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:0 6px 8px;border-bottom:1px solid var(--ink)}
.ro td{padding:9px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.ro .r{text-align:right;white-space:nowrap}
.ro td.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ro small{display:block;color:var(--ink-2);font-size:12px}
.m-only{display:none!important}

.paper-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-top:16px}
.totals{margin-left:auto;width:min(300px,100%);display:grid;gap:5px}
.tot-row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.tot-row .mono{font-variant-numeric:tabular-nums}
.tot-row.grand{border-top:2px solid var(--ink);padding-top:8px;margin-top:4px;font-weight:600;font-size:17px}
.mix{font-size:12px;color:var(--ink-2);text-align:right}
.stamp{align-self:center;transform:rotate(-8deg);border:3px solid currentColor;border-radius:6px;padding:6px 16px 4px;font:700 30px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin:6px 0 0 6px}
.stamp small{display:block;font:600 11px/1.4 var(--f-mono);letter-spacing:.04em;text-align:center}
.stamp.t-ok,.stamp.t-bad,.stamp.t-info{background:transparent}
.notes{margin-top:18px}
.notes p{margin:0;white-space:pre-wrap}
.terms{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);display:grid;gap:2px}

.panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel h3{font:600 14px/1 var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin:0 0 10px}
.check{display:flex;align-items:center;gap:10px;padding:5px 0}
.check input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
.check label{flex:1;cursor:pointer}
.check.done label{text-decoration:line-through;color:var(--ink-2)}
.inline-add{display:flex;gap:8px;margin-top:8px}
.inline-add .f{flex:1}
.pay{display:grid;grid-template-columns:90px minmax(0,1fr) auto 30px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.pay-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;margin-top:12px}
.contact{display:grid;gap:2px}
.copyline{display:flex;align-items:center;gap:6px}
.field{display:grid;gap:2px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;padding-top:16px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--bar);color:var(--bar-ink);padding:10px 18px;border-radius:999px;font-weight:500;z-index:90;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.copyfall{position:fixed;inset:auto 0 0 0;z-index:95;background:var(--surface);border-top:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -12px 32px var(--shadow)}
.copyfall textarea{width:100%;height:160px;font:13px/1.45 var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px}
.copyfall div{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}

@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .flow{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .flow li::after{display:none}
  .stage-v{font-size:26px}
}
@media (max-width:700px){
  .top-in{padding-block:12px}
  .top .btn.primary{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
  .tab{flex-direction:column;gap:4px;padding:9px 2px 8px;color:var(--ink-2);font:600 12px/1 var(--f-body);letter-spacing:.02em;text-transform:none}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--accent)}
  .tab.on::after{top:0;bottom:auto;left:22%;right:22%;border-radius:0 0 2px 2px}
  .tab svg{display:block;width:22px;height:22px}
  .tab .badge{position:absolute;top:5px;left:calc(50% + 6px);padding:2px 5px;font-size:10px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .foot{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));margin-top:-72px}
  h1{font-size:30px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .sheet{padding-left:env(safe-area-inset-left,0px)}
}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"num pill" "main main" "date amt";row-gap:4px}
  .row.client{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main amt" "date num"}
  .att{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"pill amt" "text text" "btn btn"}
  .att .pill{grid-area:pill;justify-self:start}.att .amt{grid-area:amt}.att-text{grid-area:text}.att .btn{grid-area:btn;justify-self:start}
  .sheet-body{padding:14px 12px 28px}

@media (prefers-reduced-motion:reduce){.sheet{animation:none}.toast{transition:none}}
</style>

<body>

</div>

<script>
(() => {
'use strict';
const KEY = 'fieldbook-demo-v1';
const TAX = 0.13, TAX_LABEL = 'HST 13%';
const BIZ = {name:'Harbourline Home Services', addr:'Oshawa, ON', phone:'905-555-0100', email:'office@harbourline.example', hst:'HST # 81234 5678 RT0001', etransfer:'pay@harbourline.example'};
const KINDS = {labour:'Labour', material:'Material', flat:'Flat fee'};
const PRICEBOOK = [
  {desc:'General labour', kind:'labour', qty:1, unit:'hr', rate:75},
  {desc:'Two-person crew', kind:'labour', qty:1, unit:'hr', rate:130},
  {desc:'Service call / trip charge', kind:'flat', qty:1, unit:'ea', rate:95},
  {desc:'Disposal / dump run', kind:'flat', qty:1, unit:'load', rate:120},
  {desc:'Drywall sheet 4×8 ½″', kind:'material', qty:1, unit:'sheet', rate:21.5},
  {desc:'Interior paint, 3.78 L', kind:'material', qty:1, unit:'can', rate:68},
];
const METHODS = ['e-Transfer','Cash','Cheque','Debit','Credit card'];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const iso = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const TODAY = iso(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const rel = n => addDays(TODAY, n);
const daysBetween = (a, b) => { const A = parse(a), B = parse(b); return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate()) - Date.UTC(A.getFullYear(),A.getMonth(),A.getDate())) / 864e5); };
const fmtDate = s => s ? parse(s).toLocaleDateString('en-CA', {month:'short', day:'numeric'}) : '—';
const fmtLong = s => s ? parse(s).toLocaleDateString('en-CA', {weekday:'short', month:'short', day:'numeric', year:'numeric'}) : '—';
const money = c => (c/100).toLocaleString('en-CA', {style:'currency', currency:'CAD'});
const lineCents = it => Math.round((+it.qty || 0) * (+it.rate || 0) * 100);
const totals = items => { const sub = items.reduce((s, it) => s + lineCents(it), 0); const tax = Math.round(sub * TAX); return {sub, tax, total: sub + tax}; };
const clone = items => items.map(i => ({...i, id: uid()}));
const relDay = s => { const n = daysBetween(TODAY, s); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : n > 1 ? `In ${n} days` : `${-n} days ago`; };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  overview: svg('<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/>'),
  quotes: svg('<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/>'),
  jobs: svg('<rect x="3.5" y="5" width="17" height="15.5" rx="1"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  invoices: svg('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),
  clients: svg('<circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/>'),
  x: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  copy: svg('<rect x="8" y="8" width="12" height="12" rx="1.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>'),
};

/* ---------- data ---------- */
function seed() {
  const L = (desc, kind, qty, unit, rate) => ({id: uid(), desc, kind, qty, unit, rate});
  const S = {
    bath: () => [L('Remove vanity, toilet & flooring','labour',6,'hr',75), L('Vinyl plank flooring, 22 sq ft box','material',2,'box',64), L('Vanity 30″ with top','material',1,'ea',489), L('Install vanity, toilet & flooring','labour',10,'hr',75), L('Disposal / dump run','flat',1,'load',120)],
    deck: () => [L('PT deck boards 5/4×6×12','material',18,'board',17.4), L('Railing balusters & hardware','material',1,'lot',185), L('Two-person crew','labour',9,'hr',130), L('Disposal / dump run','flat',1,'load',120)],
    dental: () => [L('Drywall patch & tape, 3 locations','labour',5,'hr',75), L('Drywall sheet 4×8 ½″','material',2,'sheet',21.5), L('Interior paint, 3.78 L','material',2,'can',68), L('Paint waiting room, 2 coats','labour',8,'hr',75)],
    door: () => [L('Exterior steel door, prehung 34″','material',1,'ea',645), L('Lockset & deadbolt','material',1,'set',89), L('Remove old door, install, trim & seal','labour',6,'hr',75)],
    t4b: () => [L('Paint unit 4B, walls & ceilings','labour',22,'hr',75), L('Interior paint, 3.78 L','material',6,'can',68), L('Swap light fixtures (owner supplied)','labour',3,'hr',75), L('Service call / trip charge','flat',1,'ea',95)],
    gutter: () => [L('Gutter clean-out, 2-storey','flat',1,'ea',210), L('Reattach downspout','labour',1,'hr',75)],
    fix2a: () => [L('Replace kitchen faucet & bath fan','labour',3.5,'hr',75), L('Bathroom exhaust fan','material',1,'ea',142), L('Service call / trip charge','flat',1,'ea',95)],
    gate: () => [L('Rehang fence gate, new hinges','labour',2.5,'hr',75), L('Heavy-duty gate hinges','material',1,'pair',46)],
    shelf: () => [L('Install reception shelving','labour',7,'hr',75), L('Shelf brackets & anchors','material',1,'lot',96)],
    storm: () => [L('Adjust storm door closer & sweep','labour',1.5,'hr',75), L('Storm door closer','material',1,'ea',38), L('Service call / trip charge','flat',1,'ea',95)],
    base: () => [L('Replace baseboards, exam rooms 1–2','labour',6,'hr',75), L('MDF baseboard 3½″ × 12′','material',8,'length',16.8)],
  };
  const clients = [
    {id:'c1', name:'Priya Natarajan', phone:'905-555-0142', email:'priya.n@example.com', address:'18 Simcoe St N, Oshawa'},
    {id:'c2', name:'Dave & Karen Mulligan', phone:'905-555-0187', email:'mulligans@example.com', address:'402 Brock St S, Whitby'},
    {id:'c3', name:'Northgate Dental', phone:'905-555-0119', email:'office@northgatedental.example', address:'1290 King St E, Unit 3, Oshawa'},
    {id:'c4', name:'Tom Bergeron', phone:'905-555-0163', email:'tbergeron@example.com', address:'77 Prestonvale Rd, Courtice'},
    {id:'c5', name:'Maple Row Property Mgmt', phone:'905-555-0175', email:'maint@maplerow.example', address:'15 Harwood Ave S, Ajax'},
  ];
  const q = (id, num, clientId, title, date, status, items, x = {}) => ({id, num, clientId, title, date, status, items, notes:'', jobId:null, ...x});
  const quotes = [
    q('q1038','Q-1038','c2','Fence gate rehang',rel(-30),'declined',S.gate(),{sentOn:rel(-30)}),
    q('q1039','Q-1039','c4','Gutter clean-out',rel(-28),'accepted',S.gutter(),{sentOn:rel(-28),acceptedOn:rel(-26),jobId:'j309'}),
    q('q1040','Q-1040','c5','Unit 2A fixture swap',rel(-35),'accepted',S.fix2a(),{sentOn:rel(-35),acceptedOn:rel(-33),jobId:'j310'}),
    q('q1041','Q-1041','c1','Basement bathroom refresh',rel(-12),'accepted',S.bath(),{sentOn:rel(-12),acceptedOn:rel(-8),jobId:'j311',notes:'Client supplies the toilet. Price includes removal and disposal of old fixtures.'}),
    q('q1042','Q-1042','c2','Deck boards & railing repair',rel(-9),'sent',S.deck(),{sentOn:rel(-9),notes:'Board count assumes 14 × 16 ft deck. Stain is not included.'}),
    q('q1043','Q-1043','c3','Waiting room drywall & paint',rel(-16),'accepted',S.dental(),{sentOn:rel(-16),acceptedOn:rel(-14),jobId:'j312',notes:'Work done after 5 pm so the office can stay open.'}),
    q('q1044','Q-1044','c4','Replace front entry door',rel(-1),'draft',S.door()),
    q('q1045','Q-1045','c5','Unit 4B turnover: paint & fixtures',rel(-2),'sent',S.t4b(),{sentOn:rel(-2)}),
  ];
  const ck = (t, done = false) => ({id: uid(), t, done});
  const j = (id, num, clientId, quoteId, title, date, status, items, x = {}) => ({id, num, clientId, quoteId, title, date, status, items, checklist:[], notes:'', invoiceId:null, ...x});
  const jobs = [
    j('j308','J-308','c3',null,'Reception shelving install',rel(-27),'done',S.shelf(),{invoiceId:'i2206',checklist:[ck('Find studs behind reception wall',true),ck('Level & anchor brackets',true)]}),
    j('j309','J-309','c4','q1039','Gutter clean-out',rel(-21),'done',S.gutter(),{invoiceId:'i2207'}),
    j('j310','J-310','c5','q1040','Unit 2A fixture swap',rel(-26),'done',S.fix2a(),{invoiceId:'i2208'}),
    j('j311','J-311','c1','q1041','Basement bathroom refresh',rel(3),'scheduled',S.bath(),{checklist:[ck('Confirm vanity delivery date',true),ck('Check shut-off valves before demo'),ck('Protect hallway floor'),ck('Book dump run')],notes:'Side door code 4471. Dog in the backyard.'}),
    j('j312','J-312','c3','q1043','Waiting room drywall & paint',rel(-1),'done',S.dental(),{checklist:[ck('Patch & sand 3 spots',true),ck('Two coats, eggshell',true),ck('Rehang artwork',true)],notes:'Paint colour: BM Pale Oak OC-20, eggshell.'}),
    j('j313','J-313','c3',null,'Exam room baseboards',TODAY,'in_progress',S.base(),{checklist:[ck('Remove old baseboard',true),ck('Cut & fit new MDF'),ck('Caulk & paint')]}),
    j('j314','J-314','c2',null,'Storm door adjustment',rel(-6),'done',S.storm(),{invoiceId:'i2209'}),
  ];
  const inv = (id, num, clientId, jobId, title, date, items, pay) => ({id, num, clientId, jobId, title, date, dueDays:15, sent:true, sentOn:date, items, notes:'', payments: pay ? pay(totals(items).total) : []});
  const invoices = [
    inv('i2206','INV-2206','c3','j308','Reception shelving install',rel(-26),S.shelf(),t => [{id:uid(),date:rel(-14),cents:t,method:'Cheque'}]),
    inv('i2207','INV-2207','c4','j309','Gutter clean-out',rel(-20),S.gutter(),t => [{id:uid(),date:rel(-6),cents:t,method:'e-Transfer'}]),
    inv('i2208','INV-2208','c5','j310','Unit 2A fixture swap',rel(-24),S.fix2a()),
    inv('i2209','INV-2209','c2','j314','Storm door adjustment',rel(-5),S.storm(),() => [{id:uid(),date:rel(-5),cents:10000,method:'Cash'}]),
  ];
  return {v:1, edited:false, clients, quotes, jobs, invoices, seq:{q:1046, j:315, i:2210}};
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && d.v === 1 && d.edited) return d; } } catch (e) {}
  return seed();
}
function save() { db.edited = true; try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

let db = load();
const state = {view:'overview', sheet:null, returnTo:null, filters:{quotes:'all', invoices:'all'}};
const COL = {quote:'quotes', job:'jobs', invoice:'invoices', client:'clients'};
const byId = (arr, id) => arr.find(x => x.id === id);
const client = id => byId(db.clients, id) || {name:'No client', address:'', phone:'', email:''};
const getRec = () => state.sheet ? byId(db[COL[state.sheet.type]], state.sheet.id) : null;
const blankItem = () => ({id:uid(), desc:'', kind:'labour', qty:1, unit:'hr', rate:75});

function iInfo(inv) {
  const t = totals(inv.items);
  const paid = inv.payments.reduce((s, p) => s + p.cents, 0);
  const due = addDays(inv.date, +inv.dueDays || 0);
  const bal = t.total - paid;
  let status;
  if (t.total > 0 && bal <= 0) status = 'paid';
  else if (!inv.sent) status = 'draft';
  else if (daysBetween(due, TODAY) > 0) status = 'overdue';
  else if (paid > 0) status = 'partial';
  else status = 'sent';
  return {...t, paid, bal, due, status};
}

const PILLS = {
  quote: {draft:['Draft','mute'], sent:['Sent','info'], accepted:['Accepted','ok'], declined:['Declined','bad']},
  job: {scheduled:['Scheduled','info'], in_progress:['On site','warn'], done:['Done','ok']},
  invoice: {draft:['Draft','mute'], sent:['Sent','info'], partial:['Part paid','warn'], overdue:['Overdue','bad'], paid:['Paid','ok']},
};
const pill = (type, st) => { const [l, t] = PILLS[type][st]; return `<span class="pill t-${t}">${l}</span>`; };

/* ---------- main views ---------- */
const TABS = [['overview','Overview'],['quotes','Quotes'],['jobs','Jobs'],['invoices','Invoices'],['clients','Clients']];
function renderTabs() {
  const badge = {
    jobs: db.jobs.filter(j => j.status === 'done' && !j.invoiceId).length,
    invoices: db.invoices.filter(i => iInfo(i).status === 'overdue').length,
  };
  $('#tabs').innerHTML = `<div class="wrap tabs-in">${TABS.map(([k, l]) => `<a href="#${k}" class="tab${state.view === k ? ' on' : ''}"${state.view === k ? ' aria-current="page"' : ''}>${ICON[k]}<span>${l}</span>${badge[k] ? `<span class="badge" title="Needs attention">${badge[k]}</span>` : ''}</a>`).join('')}</div>`;
}

function viewOverview() {
  const sent = db.quotes.filter(q => q.status === 'sent');
  const drafts = db.quotes.filter(q => q.status === 'draft');
  const quotedVal = sent.reduce((s, q) => s + totals(q.items).total, 0);
  const open = db.jobs.filter(j => j.status !== 'done').sort((a, b) => a.date.localeCompare(b.date));
  const week = open.filter(j => daysBetween(TODAY, j.date) <= 7);
  const weekVal = week.reduce((s, j) => s + totals(j.items).total, 0);
  const infos = db.invoices.map(i => [i, iInfo(i)]);
  const unpaid = infos.filter(([, x]) => ['sent','partial','overdue'].includes(x.status));
  const unpaidVal = unpaid.reduce((s, [, x]) => s + x.bal, 0);
  const overdue = unpaid.filter(([, x]) => x.status === 'overdue');
  const cutoff = rel(-30);
  const collected = db.invoices.flatMap(i => i.payments).filter(p => p.date >= cutoff && p.date <= TODAY).reduce((s, p) => s + p.cents, 0);

  const att = [];
  overdue.forEach(([i, x]) => att.push({tone:'bad', tag:'Overdue', text:`<strong>${esc(i.num)}</strong> for ${esc(client(i.clientId).name)} is ${plural(daysBetween(x.due, TODAY), 'day')} past due`, amt:x.bal, btn:`<button class="btn sm" data-open="invoice:${i.id}">Open invoice</button>`}));
  db.jobs.filter(j => j.status === 'done' && !j.invoiceId).forEach(j => att.push({tone:'warn', tag:'Not invoiced', text:`<strong>${esc(j.num)}</strong> ${esc(j.title)} was finished ${relDay(j.date).toLowerCase()}`, amt:totals(j.items).total, btn:`<button class="btn sm primary" data-act="j-invoice" data-id="${j.id}">Create invoice</button>`}));
  sent.filter(q => q.sentOn && daysBetween(q.sentOn, TODAY) >= 7).forEach(q => att.push({tone:'info', tag:'Follow up', text:`<strong>${esc(q.num)}</strong> to ${esc(client(q.clientId).name)} has had no reply for ${plural(daysBetween(q.sentOn, TODAY), 'day')}`, amt:totals(q.items).total, btn:`<button class="btn sm" data-open="quote:${q.id}">Open quote</button>`}));
  db.quotes.filter(q => q.status === 'accepted' && !q.jobId).forEach(q => att.push({tone:'ok', tag:'Book it', text:`<strong>${esc(q.num)}</strong> ${esc(q.title)} was accepted and needs a date`, amt:totals(q.items).total, btn:`<button class="btn sm primary" data-act="q-schedule" data-id="${q.id}">Schedule job</button>`}));
  drafts.forEach(q => att.push({tone:'mute', tag:'Draft', text:`<strong>${esc(q.num)}</strong> ${esc(q.title || 'Untitled quote')} for ${esc(client(q.clientId).name)} hasn't been sent`, amt:totals(q.items).total, btn:`<button class="btn sm" data-open="quote:${q.id}">Finish quote</button>`}));

  const dateLine = parse(TODAY).toLocaleDateString('en-CA', {weekday:'long', month:'long', day:'numeric'});
  return `
  <div class="view-head"><div><h1>Overview</h1><p class="lede">${dateLine} · ${att.length ? `${plural(att.length, 'thing')} need${att.length === 1 ? 's' : ''} attention` : 'Nothing needs attention'}</p></div></div>
  <ol class="flow" aria-label="From quote to paid">
    <li><a class="stage" href="#quotes"><span class="stage-k"><b>1</b>Quoted</span><span class="stage-v">${money(quotedVal)}</span><span class="stage-s">${plural(sent.length, 'quote')} awaiting reply${drafts.length ? ` · ${drafts.length} draft` : ''}</span></a></li>
    <li><a class="stage" href="#jobs"><span class="stage-k"><b>2</b>Booked</span><span class="stage-v">${money(weekVal)}</span><span class="stage-s">${plural(week.length, 'job')} in the next 7 days</span></a></li>
    <li><a class="stage" href="#invoices"><span class="stage-k"><b>3</b>Invoiced</span><span class="stage-v">${money(unpaidVal)}</span><span class="stage-s">${unpaid.length} unpaid${overdue.length ? ` · ${overdue.length} overdue` : ''}</span></a></li>
    <li><a class="stage" href="#invoices"><span class="stage-k"><b>4</b>Paid</span><span class="stage-v">${money(collected)}</span><span class="stage-s">collected in the last 30 days</span></a></li>
  </ol>
  <div class="cols">
    <section><h2 class="sec">Needs attention</h2>
      <div class="list">${att.length ? att.map(a => `<div class="att"><span class="pill t-${a.tone}">${a.tag}</span><span class="att-text">${a.text}</span><span class="amt">${money(a.amt)}</span>${a.btn}</div>`).join('') : `<div class="empty">You're all caught up.</div>`}</div>
    </section>
    <section><h2 class="sec"><span>Coming up</span><a class="linkish small" href="#jobs">All jobs</a></h2>
      <div class="list">${open.length ? open.slice(0, 6).map(jobRow).join('') : `<div class="empty">No jobs booked. Accepted quotes become jobs here.</div>`}</div>
    </section>
  </div>`;
}

function jobRow(j) {
  const d = parse(j.date);
  return `<button class="jrow" data-open="job:${j.id}">
    <span class="datebox"><b>${d.getDate()}</b><small>${d.toLocaleDateString('en-CA', {month:'short'}).replace('.', '')}</small></span>
    <span style="min-width:0"><strong>${esc(j.title || 'Untitled job')}</strong><small>${relDay(j.date)} · ${esc(client(j.clientId).name)}</small></span>
    ${pill('job', j.status)}</button>`;
}
function docRow(type, r, amtHTML, sub) {
  const st = type === 'invoice' ? iInfo(r).status : r.status;
  return `<button class="row" data-open="${type}:${r.id}">
    <span class="c-num">${esc(r.num)}</span>
    <span class="c-main"><strong>${esc(r.title || 'Untitled')}</strong><small>${esc(client(r.clientId).name)}</small></span>
    <span class="c-date">${sub}</span>
    <span class="c-pill">${pill(type, st)}</span>
    <span class="c-amt">${amtHTML}</span></button>`;
}
const chips = (view, opts) => `<div class="chips" role="group" aria-label="Filter">${opts.map(([k, l, n]) => `<button class="chip" data-act="filter" data-view="${view}" data-f="${k}" aria-pressed="${state.filters[view] === k}">${l} <span class="mono">${n}</span></button>`).join('')}</div>`;

function viewQuotes() {
  const f = state.filters.quotes;
  const cnt = s => db.quotes.filter(q => q.status === s).length;
  const list = db.quotes.filter(q => f === 'all' || q.status === f).sort((a, b) => b.num.localeCompare(a.num));
  return `<div class="view-head"><div><h1>Quotes</h1><p class="lede">Price the work, send it, and turn accepted quotes into jobs.</p></div><button class="btn primary" data-act="new-quote">New quote</button></div>
  ${chips('quotes', [['all','All',db.quotes.length],['draft','Draft',cnt('draft')],['sent','Sent',cnt('sent')],['accepted','Accepted',cnt('accepted')],['declined','Declined',cnt('declined')]])}
  <div class="list">${list.length ? list.map(q => docRow('quote', q, money(totals(q.items).total), fmtDate(q.date))).join('') : `<div class="empty">No quotes here yet.</div>`}</div>`;
}

function viewJobs() {
  const by = (a, b) => a.date.localeCompare(b.date);
  const groups = [
    ['On site now', db.jobs.filter(j => j.status === 'in_progress').sort(by)],
    ['Scheduled', db.jobs.filter(j => j.status === 'scheduled').sort(by)],
    ['Done · ready to invoice', db.jobs.filter(j => j.status === 'done' && !j.invoiceId).sort(by)],
    ['Done · invoiced', db.jobs.filter(j => j.status === 'done' && j.invoiceId).sort((a, b) => b.date.localeCompare(a.date))],
  ].filter(([, l]) => l.length);
  return `<div class="view-head"><div><h1>Jobs</h1><p class="lede">Work orders with dates, site notes and checklists.</p></div><button class="btn primary" data-act="new-job">New job</button></div>
  ${groups.length ? groups.map(([h, l]) => `<h2 class="sec">${h} <span class="mono">${l.length}</span></h2><div class="list">${l.map(jobRow).join('')}</div>`).join('') : `<div class="list"><div class="empty">No jobs yet. Schedule one from an accepted quote.</div></div>`}`;
}

function viewInvoices() {
  const f = state.filters.invoices;
  const infos = db.invoices.map(i => [i, iInfo(i)]);
  const test = {all: () => true, unpaid: x => ['sent','partial','overdue'].includes(x.status), overdue: x => x.status === 'overdue', paid: x => x.status === 'paid', draft: x => x.status === 'draft'};
  const n = k => infos.filter(([, x]) => test[k](x)).length;
  const list = infos.filter(([, x]) => test[f](x)).sort((a, b) => b[0].num.localeCompare(a[0].num));
  const owed = infos.filter(([, x]) => test.unpaid(x)).reduce((s, [, x]) => s + x.bal, 0);
  return `<div class="view-head"><div><h1>Invoices</h1><p class="lede">${money(owed)} outstanding across ${plural(n('unpaid'), 'invoice')}.</p></div><button class="btn primary" data-act="new-invoice">New invoice</button></div>
  ${chips('invoices', [['all','All',infos.length],['unpaid','Unpaid',n('unpaid')],['overdue','Overdue',n('overdue')],['paid','Paid',n('paid')],['draft','Draft',n('draft')]])}
  <div class="list">${list.length ? list.map(([i, x]) => docRow('invoice', i, x.status === 'paid' || x.bal === x.total ? money(x.total) : `${money(x.bal)}<small>of ${money(x.total)}</small>`, x.status === 'paid' ? `Paid ${fmtDate(i.payments.map(p => p.date).sort().pop())}` : x.status === 'draft' ? fmtDate(i.date) : `Due ${fmtDate(x.due)}`)).join('') : `<div class="empty">${f === 'overdue' ? 'No overdue invoices.' : 'No invoices here.'}</div>`}</div>`;
}

function clientStats(c) {
  const inv = db.invoices.filter(i => i.clientId === c.id).map(iInfo);
  return {
    jobs: db.jobs.filter(j => j.clientId === c.id).length,
    billed: inv.filter(x => x.status !== 'draft').reduce((s, x) => s + x.total, 0),
    owing: inv.filter(x => ['sent','partial','overdue'].includes(x.status)).reduce((s, x) => s + x.bal, 0),
    records: db.quotes.filter(q => q.clientId === c.id).length + db.jobs.filter(j => j.clientId === c.id).length + db.invoices.filter(i => i.clientId === c.id).length,
  };
}
function viewClients() {
  const list = [...db.clients].sort((a, b) => a.name.localeCompare(b.name));
  return `<div class="view-head"><div><h1>Clients</h1><p class="lede">Contact details and history for everyone you work for.</p></div><button class="btn primary" data-act="new-client">New client</button></div>
  <div class="list">${list.length ? list.map(c => { const s = clientStats(c); return `<button class="row client" data-open="client:${c.id}">
    <span class="c-main"><strong>${esc(c.name || 'Unnamed client')}</strong><small>${esc(c.address)}</small></span>
    <span class="c-date mono">${esc(c.phone)}</span>
    <span class="c-num">${plural(s.jobs, 'job')}</span>
    <span class="c-amt">${money(s.billed)}${s.owing ? `<small>${money(s.owing)} owing</small>` : '<small>billed</small>'}</span></button>`; }).join('') : `<div class="empty">No clients yet.</div>`}</div>`;
}

const VIEWS = {overview:viewOverview, quotes:viewQuotes, jobs:viewJobs, invoices:viewInvoices, clients:viewClients};
function renderView() { $('#view').innerHTML = VIEWS[state.view](); }
function renderAll() { renderTabs(); renderView(); renderSheet(); }

/* ---------- document parts ---------- */
function paperHead(label, num, right) {
  return `<div class="paper-head"><div><div class="from-name">${esc(BIZ.name)}</div><div class="small muted">${esc(BIZ.addr)} · ${esc(BIZ.phone)}</div><div class="small muted mono">${esc(BIZ.hst)}</div></div>
    <div class="docid"><div class="doc-label">${label}</div><div class="doc-num mono">${esc(num)}</div>${right || ''}</div></div>`;
}
function clientBlock(r, editable, label) {
  const c = client(r.clientId);
  const sel = editable ? `<select class="f" id="f-client" data-f="clientId" data-rerender aria-label="Client">${db.clients.map(x => `<option value="${x.id}"${x.id === r.clientId ? ' selected' : ''}>${esc(x.name || 'Unnamed client')}</option>`).join('')}</select>
    <button class="linkish small" data-act="new-client" data-for="${state.sheet.type}:${r.id}" style="margin-top:6px">Add a new client</button>` : `<strong>${esc(c.name)}</strong>`;
  return `<div class="contact"><span class="lbl">${label}</span>${sel}<span class="small muted">${esc(c.address)}</span>
    ${c.phone ? `<span class="copyline small"><span class="mono">${esc(c.phone)}</span><button class="icon-btn sm" data-act="copy" data-text="${esc(c.phone)}" data-what="Phone number" aria-label="Copy phone number">${ICON.copy}</button></span>` : ''}</div>`;
}
function titleBlock(r, editable, ph) {
  return `<div class="title-wrap">${editable ? `<input class="f title" id="f-title" data-f="title" value="${esc(r.title)}" placeholder="${ph}" aria-label="Job title">` : `<h2 class="doc-title">${esc(r.title || 'Untitled')}</h2>`}</div>`;
}
function itemsBlock(r, editable) {
  if (editable) return `<div class="items" data-items>
    <div class="items-h" aria-hidden="true"><span>Description</span><span>Type</span><span class="r">Qty</span><span>Unit</span><span class="r">Rate</span><span class="r">Amount</span><span></span></div>
    ${r.items.map(it => `<div class="item" data-item="${it.id}">
      <input class="f desc" id="it-${it.id}-desc" data-k="desc" value="${esc(it.desc)}" placeholder="Describe the work or part" aria-label="Description">
      <select class="f" id="it-${it.id}-kind" data-k="kind" aria-label="Type">${Object.entries(KINDS).map(([k, l]) => `<option value="${k}"${it.kind === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
      <input class="f num" id="it-${it.id}-qty" data-k="qty" type="number" inputmode="decimal" step="0.5" min="0" value="${it.qty}" aria-label="Quantity">
      <input class="f" id="it-${it.id}-unit" data-k="unit" value="${esc(it.unit)}" placeholder="unit" aria-label="Unit">
      <input class="f num" id="it-${it.id}-rate" data-k="rate" type="number" inputmode="decimal" step="0.01" min="0" value="${it.rate}" aria-label="Rate in dollars">
      <span class="amt">${money(lineCents(it))}</span>
      <button class="icon-btn sm" data-act="rm-item" aria-label="Remove line">${ICON.x}</button></div>`).join('')}
    </div>
    <div class="add-line"><button class="btn sm" data-act="add-item">Add line</button><span class="pb-label">Price book</span>
      ${PRICEBOOK.map((p, i) => `<button class="chip" data-act="add-preset" data-i="${i}">${esc(p.desc)} <span class="mono">${money(p.rate * 100)}/${p.unit}</span></button>`).join('')}</div>`;
  return `<div class="ro-wrap"><table class="ro"><thead><tr><th>Description</th><th class="r d-only">Qty</th><th class="r d-only">Rate</th><th class="r">Amount</th></tr></thead><tbody>
    ${r.items.length ? r.items.map(it => `<tr><td>${esc(it.desc || '(no description)')}<small class="d-only">${KINDS[it.kind] || ''}</small><small class="m-only">${it.qty} ${esc(it.unit)} × ${money(it.rate * 100)}</small></td><td class="r d-only">${it.qty} ${esc(it.unit)}</td><td class="r d-only">${money(it.rate * 100)}</td><td class="r">${money(lineCents(it))}</td></tr>`).join('') : `<tr><td colspan="4" class="muted">No line items.</td></tr>`}
  </tbody></table></div>`;
}
function totalsHTML(r, type) {
  const t = totals(r.items);
  const mix = Object.keys(KINDS).map(k => [KINDS[k], r.items.filter(i => i.kind === k).reduce((s, i) => s + lineCents(i), 0)]).filter(([, v]) => v);
  let html = `<div class="tot-row"><span>Subtotal</span><span class="mono">${money(t.sub)}</span></div>
    <div class="tot-row"><span>${TAX_LABEL}</span><span class="mono">${money(t.tax)}</span></div>
    <div class="tot-row grand"><span>Total</span><span class="mono">${money(t.total)}</span></div>`;
  if (type === 'invoice') { const x = iInfo(r); if (x.paid) html += `<div class="tot-row"><span>Paid</span><span class="mono">−${money(x.paid)}</span></div><div class="tot-row grand"><span>Balance due</span><span class="mono">${money(Math.max(0, x.bal))}</span></div>`; }
  if (mix.length > 1) html += `<div class="mix">${mix.map(([l, v]) => `${l} ${money(v)}`).join(' · ')}</div>`;
  return html;
}
const stamp = (text, tone, sub) => `<div class="stamp t-${tone}" aria-label="${text}">${text}${sub ? `<small>${sub}</small>` : ''}</div>`;
const paperFoot = (r, type, stampHTML) => `<div class="paper-foot">${stampHTML || '<span></span>'}<div class="totals" data-totals>${totalsHTML(r, type)}</div></div>`;
function notesBlock(r, editable, label, ph) {
  if (editable) return `<div class="notes"><label class="lbl" for="f-notes">${label}</label><textarea class="f" id="f-notes" data-f="notes" placeholder="${ph}">${esc(r.notes)}</textarea></div>`;
  return r.notes ? `<div class="notes"><span class="lbl">${label}</span><p>${esc(r.notes)}</p></div>` : '';
}
const bar = (num, pillHTML, sub) => `<div class="sheet-bar"><button class="icon-btn" data-act="close" aria-label="Close">${ICON.x}</button><div class="sb-title"><span>${esc(num)}</span>${pillHTML}</div><span class="sb-sub">${sub || ''}</span></div>`;
const delBtn = what => `<button class="btn danger" data-act="del" id="del-btn">Delete ${what}</button>`;
const copyBtn = `<button class="btn" data-act="copy-doc">${ICON.copy}Copy as text</button>`;

/* ---------- sheets ---------- */
function sheetQuote(q) {
  const ed = q.status === 'draft';
  const st = q.status === 'accepted' ? stamp('Accepted', 'ok', q.acceptedOn ? fmtDate(q.acceptedOn) : '') : q.status === 'declined' ? stamp('Declined', 'bad') : '';
  const job = q.jobId && byId(db.jobs, q.jobId);
  let foot;
  if (q.status === 'draft') foot = `${delBtn('quote')}<span class="spacer"></span>${copyBtn}<button class="btn primary" data-act="q-send">Mark as sent</button>`;
  else if (q.status === 'sent') foot = `<button class="btn ghost" data-act="q-draft">Edit quote</button><span class="spacer"></span><button class="btn" data-act="q-decline">Client declined</button><button class="btn primary" data-act="q-accept">Client accepted</button>`;
  else if (q.status === 'accepted') foot = `<span class="spacer"></span>${copyBtn}${job ? `<button class="btn primary" data-open="job:${job.id}">Open ${esc(job.num)}</button>` : `<button class="btn primary" data-act="q-schedule">Schedule job</button>`}`;
  else foot = `${delBtn('quote')}<span class="spacer"></span><button class="btn" data-act="q-draft">Reopen as draft</button>`;
  const sub = q.status === 'sent' && q.sentOn ? `Sent ${relDay(q.sentOn).toLowerCase()}` : q.status === 'draft' ? 'Changes save automatically' : '';
  return `${bar(q.num, pill('quote', q.status), sub)}
  <div class="sheet-body">
    ${q.status === 'sent' ? `<p class="small muted" style="margin:0 0 12px">This quote has been sent, so it's locked. Choose <strong>Edit quote</strong> to revise it and send it again.</p>` : ''}
    <article class="paper">
      ${paperHead('Quote', q.num, `<div class="small muted">Issued ${fmtLong(q.date)}</div><div class="small muted">Valid until ${fmtLong(addDays(q.date, 30))}</div>`)}
      <div class="meta">${clientBlock(q, ed, 'Prepared for')}
        ${job ? `<div class="contact"><span class="lbl">Work order</span><button class="linkish" data-open="job:${job.id}">${esc(job.num)} · ${fmtDate(job.date)}</button></div>` : ''}</div>
      ${titleBlock(q, ed, 'What is the job? e.g. Kitchen backsplash')}
      ${itemsBlock(q, ed)}
      ${paperFoot(q, 'quote', st)}
      ${notesBlock(q, ed, 'Notes & exclusions', 'What is and isn’t included, timing, access…')}
      <div class="terms"><span>Prices in CAD. ${TAX_LABEL} applies. Quote valid for 30 days.</span><span>To accept, reply to this quote or call ${esc(BIZ.phone)}.</span></div>
    </article>
  </div>
  <div class="sheet-foot">${foot}</div>`;
}

function sheetJob(j) {
  const ed = !j.invoiceId;
  const quote = j.quoteId && byId(db.quotes, j.quoteId);
  const invc = j.invoiceId && byId(db.invoices, j.invoiceId);
  const doneCount = j.checklist.filter(c => c.done).length;
  let foot;
  if (j.status === 'scheduled') foot = `${ed ? delBtn('job') : ''}<span class="spacer"></span><button class="btn" data-act="j-start">Start job</button><button class="btn primary" data-act="j-done">Mark done</button>`;
  else if (j.status === 'in_progress') foot = `<button class="btn ghost" data-act="j-reopen">Back to scheduled</button><span class="spacer"></span><button class="btn primary" data-act="j-done">Mark done</button>`;
  else if (!invc) foot = `<button class="btn ghost" data-act="j-reopen">Reopen job</button><span class="spacer"></span><button class="btn primary" data-act="j-invoice">Create invoice</button>`;
  else foot = `<span class="spacer"></span>${copyBtn}<button class="btn primary" data-open="invoice:${invc.id}">Open ${esc(invc.num)}</button>`;
  return `${bar(j.num, pill('job', j.status), relDay(j.date))}
  <div class="sheet-body">
    <article class="paper">
      ${paperHead('Work order', j.num, `<label class="small muted" for="f-date" style="display:block;margin-top:6px">Scheduled</label><input class="f mono" type="date" id="f-date" data-f="date" data-rerender value="${j.date}" style="max-width:170px;text-align:right">`)}
      <div class="meta">${clientBlock(j, ed && !quote, 'Client & site')}
        <div class="contact"><span class="lbl">Paperwork</span>
          ${quote ? `<span>Quote <button class="linkish" data-open="quote:${quote.id}">${esc(quote.num)}</button></span>` : `<span class="muted small">No quote. Booked directly.</span>`}
          ${invc ? `<span>Invoice <button class="linkish" data-open="invoice:${invc.id}">${esc(invc.num)}</button></span>` : ''}</div></div>
      ${titleBlock(j, ed, 'What is the job?')}
      ${ed ? `<p class="small muted" style="margin:4px 0 0">Add extra work or parts found on site. Everything here carries over to the invoice.</p>` : ''}
      ${itemsBlock(j, ed)}
      ${paperFoot(j, 'job', j.status === 'done' ? stamp('Complete', 'ok', fmtDate(j.date)) : '')}
    </article>
    <section class="panel"><h3>Checklist · ${doneCount}/${j.checklist.length}</h3>
      ${j.checklist.map(c => `<div class="check${c.done ? ' done' : ''}"><input type="checkbox" id="ck-${c.id}" data-chk="${c.id}"${c.done ? ' checked' : ''}><label for="ck-${c.id}">${esc(c.t)}</label><button class="icon-btn sm" data-act="chk-rm" data-id="${c.id}" aria-label="Remove checklist item">${ICON.x}</button></div>`).join('')}
      <div class="inline-add"><input class="f" id="chk-new" placeholder="Add a step, e.g. Pick up permit" aria-label="New checklist step"><button class="btn sm" data-act="chk-add">Add</button></div>
    </section>
    <section class="panel"><h3><label for="f-notes">Site notes</label></h3><textarea class="f" id="f-notes" data-f="notes" placeholder="Door codes, parking, pets, paint colours…">${esc(j.notes)}</textarea></section>
  </div>
  <div class="sheet-foot">${foot}</div>`;
}

function sheetInvoice(inv) {
  const x = iInfo(inv);
  const ed = x.status === 'draft';
  const job = inv.jobId && byId(db.jobs, inv.jobId);
  const st = x.status === 'paid' ? stamp('Paid', 'ok', fmtDate(inv.payments.map(p => p.date).sort().pop())) : x.status === 'overdue' ? stamp('Overdue', 'bad', `${plural(daysBetween(x.due, TODAY), 'day')}`) : '';
  const terms = ed ? `<label class="small muted" for="f-terms" style="display:block;margin-top:6px">Terms</label><select class="f" id="f-terms" data-f="dueDays" data-rerender style="max-width:170px">${[[0,'Due on receipt'],[15,'Net 15'],[30,'Net 30']].map(([v, l]) => `<option value="${v}"${+inv.dueDays === v ? ' selected' : ''}>${l}</option>`).join('')}</select>` : '';
  let foot;
  if (ed) foot = `${delBtn('invoice')}<span class="spacer"></span>${copyBtn}<button class="btn primary" data-act="i-send">Mark as sent</button>`;
  else if (x.status === 'paid') foot = `<span class="spacer"></span>${copyBtn}${job ? `<button class="btn" data-open="job:${job.id}">Open ${esc(job.num)}</button>` : ''}`;
  else foot = `${inv.payments.length ? '' : `<button class="btn ghost" data-act="i-draft">Edit invoice</button>`}<span class="spacer"></span>${copyBtn}<button class="btn primary" data-act="pay-full">Paid in full · ${money(x.bal)}</button>`;
  const sub = x.status === 'draft' ? 'Changes save automatically' : x.status === 'paid' ? '' : `Due ${relDay(x.due).toLowerCase()}`;
  return `${bar(inv.num, pill('invoice', x.status), sub)}
  <div class="sheet-body">
    <article class="paper">
      ${paperHead('Invoice', inv.num, `<div class="small muted">Issued ${fmtLong(inv.date)}</div><div class="small${x.status === 'overdue' ? '' : ' muted'}"${x.status === 'overdue' ? ' style="color:var(--bad);font-weight:600"' : ''}>Due ${fmtLong(x.due)}</div>${terms}`)}
      <div class="meta">${clientBlock(inv, ed && !job, 'Bill to')}
        ${job ? `<div class="contact"><span class="lbl">For work order</span><button class="linkish" data-open="job:${job.id}">${esc(job.num)}</button><span class="small muted">Completed ${fmtDate(job.date)}</span></div>` : ''}</div>
      ${titleBlock(inv, ed, 'What was the work?')}
      ${itemsBlock(inv, ed)}
      ${paperFoot(inv, 'invoice', st)}
      ${notesBlock(inv, ed, 'Notes', 'Thank-you note, warranty info…')}
      <div class="terms"><span>Pay by e-Transfer to <span class="mono">${esc(BIZ.etransfer)}</span> (auto-deposit on).</span><span>Cheques payable to ${esc(BIZ.name)}. ${TAX_LABEL} included above.</span></div>
    </article>
    ${ed ? '' : `<section class="panel"><h3>Payments</h3>
      ${inv.payments.length ? inv.payments.map(p => `<div class="pay"><span class="mono small">${fmtDate(p.date)}</span><span>${esc(p.method)}</span><span class="mono">${money(p.cents)}</span><button class="icon-btn sm" data-act="pay-rm" data-id="${p.id}" aria-label="Remove payment">${ICON.x}</button></div>`).join('') : `<p class="small muted" style="margin:0">No payments recorded yet.</p>`}
      ${x.bal > 0 ? `<div class="pay-form">
        <div class="field"><label class="lbl" for="pay-amt">Amount</label><input class="f num" id="pay-amt" type="number" inputmode="decimal" step="0.01" min="0" value="${(x.bal / 100).toFixed(2)}"></div>
        <div class="field"><label class="lbl" for="pay-method">Method</label><select class="f" id="pay-method">${METHODS.map(m => `<option>${m}</option>`).join('')}</select></div>
        <div class="field"><label class="lbl" for="pay-date">Received</label><input class="f mono" id="pay-date" type="date" value="${TODAY}"></div>
        <button class="btn" data-act="pay">Record payment</button></div>` : ''}
    </section>`}
  </div>
  <div class="sheet-foot">${foot}</div>`;
}

function sheetClient(c) {
  const s = clientStats(c);
  const back = state.returnTo && byId(db[COL[state.returnTo.type]], state.returnTo.id);
  const hist = [
    ...db.quotes.filter(q => q.clientId === c.id).map(q => ({t:'quote', r:q, d:q.date, st:pill('quote', q.status), amt:totals(q.items).total})),
    ...db.jobs.filter(j => j.clientId === c.id).map(j => ({t:'job', r:j, d:j.date, st:pill('job', j.status), amt:totals(j.items).total})),
    ...db.invoices.filter(i => i.clientId === c.id).map(i => ({t:'invoice', r:i, d:i.date, st:pill('invoice', iInfo(i).status), amt:totals(i.items).total})),
  ].sort((a, b) => b.d.localeCompare(a.d));
  const field = (k, l, type = 'text', ph = '') => `<div class="field"><label class="lbl" for="cl-${k}">${l}</label><input class="f" id="cl-${k}" type="${type}" data-f="${k}" value="${esc(c[k])}" placeholder="${ph}"></div>`;
  const foot = back
    ? `<span class="spacer"></span><button class="btn primary" data-act="close">Use for ${esc(back.num)}</button>`
    : `${s.records ? '' : delBtn('client')}<span class="spacer"></span><button class="btn primary" data-act="new-quote" data-client="${c.id}">New quote</button>`;
  return `${bar(c.name || 'New client', '', s.owing ? `${money(s.owing)} owing` : '')}
  <div class="sheet-body">
    <section class="panel" style="margin-top:0"><h3>Contact</h3>
      <div class="form-grid" style="padding-top:0">${field('name', 'Name or business', 'text', 'e.g. Sam Patel')}${field('phone', 'Phone', 'tel', '905-555-0123')}${field('email', 'Email', 'email', 'name@example.com')}${field('address', 'Site address', 'text', 'Street, town')}</div>
    </section>
    <section class="panel"><h3>History · ${money(s.billed)} billed</h3>
      ${hist.length ? `<div class="list">${hist.map(h => `<button class="row" data-open="${h.t}:${h.r.id}"><span class="c-num">${esc(h.r.num)}</span><span class="c-main"><strong>${esc(h.r.title || 'Untitled')}</strong><small>${h.t === 'job' ? 'Work order' : h.t[0].toUpperCase() + h.t.slice(1)}</small></span><span class="c-date">${fmtDate(h.d)}</span><span class="c-pill">${h.st}</span><span class="c-amt">${money(h.amt)}</span></button>`).join('')}</div>` : `<p class="small muted" style="margin:0">No quotes, jobs or invoices yet.</p>`}
    </section>
  </div>
  <div class="sheet-foot">${foot}</div>`;
}

const SHEETS = {quote:sheetQuote, job:sheetJob, invoice:sheetInvoice, client:sheetClient};
function renderSheet() {
  const el = $('#sheet');
  const rec = getRec();
  if (!state.sheet || !rec) {
    state.sheet = null; el.hidden = true; el.innerHTML = ''; $('#scrim').hidden = true; document.body.classList.remove('locked'); return;
  }
  const old = el.querySelector('.sheet-body'); const top = old ? old.scrollTop : 0;
  el.innerHTML = SHEETS[state.sheet.type](rec);
  el.hidden = false; $('#scrim').hidden = false; document.body.classList.add('locked');
  const nb = el.querySelector('.sheet-body'); if (nb) nb.scrollTop = top;
}
function openSheet(type, id) {
  if (state.sheet && state.sheet.type === 'client' && type !== 'client') cleanupClient();
  state.sheet = {type, id};
  renderSheet();
  const b = $('#sheet .sheet-body'); if (b) b.scrollTop = 0;
  const c = $('#sheet [data-act="close"]'); if (c) c.focus({preventScroll:true});
}
function cleanupClient() {
  const c = getRec();
  if (c && !c.name.trim() && !clientStats(c).records) { db.clients = db.clients.filter(x => x !== c); save(); }
}
function closeSheet() {
  if (state.sheet && state.sheet.type === 'client') {
    const c = getRec();
    cleanupClient();
    if (state.returnTo) {
      const back = byId(db[COL[state.returnTo.type]], state.returnTo.id);
      const rt = state.returnTo; state.returnTo = null;
      if (back) { if (c && byId(db.clients, c.id)) { back.clientId = c.id; save(); } renderTabs(); renderView(); openSheet(rt.type, rt.id); return; }
    }
  }
  state.sheet = null; state.returnTo = null;
  renderSheet(); renderTabs(); renderView();
}

/* ---------- actions ---------- */
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
function commit() { save(); renderTabs(); renderView(); renderSheet(); }
function arm(btn, label) {
  if (btn.dataset.armed) return true;
  const old = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; btn.classList.remove('armed'); } }, 3500);
  return false;
}
async function copyText(text, what) {
  try { if (!navigator.clipboard) throw new Error('no clipboard'); await navigator.clipboard.writeText(text); toast(`${what} copied`); }
  catch (e) { const box = $('#copyfall'); const ta = $('#copyfall-text'); ta.value = text; box.hidden = false; ta.focus(); ta.select(); }
}
function docText(type, r) {
  const label = {quote:'Quote', job:'Work order', invoice:'Invoice'}[type];
  const c = client(r.clientId), t = totals(r.items);
  const out = [`${label} ${r.num} from ${BIZ.name}`];
  if (r.title) out.push(r.title);
  out.push(`For: ${c.name}${c.address ? ', ' + c.address : ''}`, `Date: ${fmtLong(r.date)}`);
  const x = type === 'invoice' ? iInfo(r) : null;
  if (x) out.push(`Due: ${fmtLong(x.due)}`);
  out.push('');
  r.items.forEach(it => out.push(`${it.qty} ${it.unit}  ${it.desc || '(no description)'} @ ${money(it.rate * 100)} = ${money(lineCents(it))}`));
  out.push('', `Subtotal: ${money(t.sub)}`, `${TAX_LABEL}: ${money(t.tax)}`, `Total: ${money(t.total)}`);
  if (x) { if (x.paid) out.push(`Paid: ${money(x.paid)}`); out.push(`Balance due: ${money(Math.max(0, x.bal))}`, '', `Pay by e-Transfer to ${BIZ.etransfer}`); }
  if (type === 'quote') out.push('', 'Valid for 30 days. Reply to accept.');
  if (r.notes) out.push('', r.notes);
  return out.join('\n');
}
function newQuote(clientId) {
  const q = {id:uid(), num:'Q-' + db.seq.q++, clientId, title:'', date:TODAY, status:'draft', items:[blankItem()], notes:'', jobId:null};
  db.quotes.push(q); save(); renderTabs(); renderView(); openSheet('quote', q.id);
  const t = $('#f-title'); if (t) t.focus();
  toast(`Started ${q.num}`);
}
function invoiceFromJob(j) {
  const inv = {id:uid(), num:'INV-' + db.seq.i++, clientId:j.clientId, jobId:j.id, title:j.title, date:TODAY, dueDays:15, sent:false, items:clone(j.items), notes:'Thanks for your business.', payments:[]};
  db.invoices.push(inv); j.invoiceId = inv.id; save(); renderTabs(); renderView(); openSheet('invoice', inv.id);
  toast(`${inv.num} drafted from ${j.num}`);
}

document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) { const [t, id] = o.dataset.open.split(':'); openSheet(t, id); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  const rec = getRec();
  const type = state.sheet && state.sheet.type;
  switch (act) {
    case 'close': closeSheet(); break;
    case 'filter': state.filters[a.dataset.view] = a.dataset.f; renderView(); break;
    case 'new-quote': {
      const cid = a.dataset.client || (db.clients[0] && db.clients[0].id);
      if (!cid) { toast('Add a client first'); break; }
      newQuote(cid); break;
    }
    case 'new-job': {
      if (!db.clients[0]) { toast('Add a client first'); break; }
      const j = {id:uid(), num:'J-' + db.seq.j++, clientId:db.clients[0].id, quoteId:null, title:'', date:rel(1), status:'scheduled', items:[blankItem()], checklist:[], notes:'', invoiceId:null};
      db.jobs.push(j); save(); renderTabs(); renderView(); openSheet('job', j.id); toast(`Booked ${j.num} for tomorrow`); break;
    }
    case 'new-invoice': {
      if (!db.clients[0]) { toast('Add a client first'); break; }
      const inv = {id:uid(), num:'INV-' + db.seq.i++, clientId:db.clients[0].id, jobId:null, title:'', date:TODAY, dueDays:15, sent:false, items:[blankItem()], notes:'', payments:[]};
      db.invoices.push(inv); save(); renderTabs(); renderView(); openSheet('invoice', inv.id); toast(`Started ${inv.num}`); break;
    }
    case 'new-client': {
      const c = {id:uid(), name:'', phone:'', email:'', address:''};
      db.clients.push(c); save();
      if (a.dataset.for) { const [t, id] = a.dataset.for.split(':'); state.returnTo = {type:t, id}; }
      openSheet('client', c.id); const n = $('#cl-name'); if (n) n.focus(); break;
    }
    case 'add-item': case 'add-preset': {
      if (!rec) break;
      const it = act === 'add-item' ? blankItem() : {...PRICEBOOK[+a.dataset.i], id:uid()};
      rec.items.push(it); commit();
      if (act === 'add-item') { const d = document.getElementById(`it-${it.id}-desc`); if (d) d.focus(); }
      else toast(`Added ${it.desc}`);
      break;
    }
    case 'rm-item': { const id = a.closest('[data-item]').dataset.item; rec.items = rec.items.filter(i => i.id !== id); commit(); break; }
    case 'q-send': rec.status = 'sent'; rec.sentOn = TODAY; commit(); toast(`${rec.num} marked as sent`); break;
    case 'q-accept': rec.status = 'accepted'; rec.acceptedOn = TODAY; commit(); toast(`${rec.num} accepted. Schedule the job next.`); break;
    case 'q-decline': rec.status = 'declined'; commit(); toast(`${rec.num} marked as declined`); break;
    case 'q-draft': rec.status = 'draft'; delete rec.sentOn; delete rec.acceptedOn; commit(); toast(`${rec.num} is a draft again`); break;
    case 'q-schedule': {
      const q = a.dataset.id ? byId(db.quotes, a.dataset.id) : rec;
      const j = {id:uid(), num:'J-' + db.seq.j++, clientId:q.clientId, quoteId:q.id, title:q.title || 'Untitled job', date:rel(2), status:'scheduled', items:clone(q.items),
        checklist:[{id:uid(), t:'Confirm date with client', done:false}, {id:uid(), t:'Order materials', done:false}], notes:'', invoiceId:null};
      db.jobs.push(j); q.jobId = j.id; save(); renderTabs(); renderView(); openSheet('job', j.id);
      toast(`${j.num} booked for ${fmtDate(j.date)}. Change the date if needed.`); break;
    }
    case 'j-start': rec.status = 'in_progress'; if (daysBetween(TODAY, rec.date) > 0) rec.date = TODAY; commit(); toast(`${rec.num} is on site`); break;
    case 'j-done': rec.status = 'done'; if (daysBetween(TODAY, rec.date) > 0) rec.date = TODAY; rec.checklist.forEach(c => c.done = true); commit(); toast(`${rec.num} done. Ready to invoice.`); break;
    case 'j-reopen': rec.status = 'scheduled'; commit(); break;
    case 'j-invoice': { const j = a.dataset.id ? byId(db.jobs, a.dataset.id) : rec; if (j) invoiceFromJob(j); break; }
    case 'chk-add': { const inp = $('#chk-new'); const t = inp.value.trim(); if (!t) { inp.focus(); break; } rec.checklist.push({id:uid(), t, done:false}); commit(); const n = $('#chk-new'); if (n) n.focus(); break; }
    case 'chk-rm': rec.checklist = rec.checklist.filter(c => c.id !== a.dataset.id); commit(); break;
    case 'i-send': rec.sent = true; rec.sentOn = TODAY; commit(); toast(`${rec.num} marked as sent`); break;
    case 'i-draft': rec.sent = false; commit(); toast(`${rec.num} is a draft again`); break;
    case 'pay': case 'pay-full': {
      const x = iInfo(rec);
      const cents = act === 'pay-full' ? x.bal : Math.round((parseFloat($('#pay-amt').value) || 0) * 100);
      if (cents <= 0) { toast('Enter an amount above $0'); $('#pay-amt').focus(); break; }
      const method = act === 'pay-full' ? 'e-Transfer' : $('#pay-method').value;
      const date = act === 'pay-full' ? TODAY : ($('#pay-date').value || TODAY);
      rec.payments.push({id:uid(), date, cents, method});
      commit();
      toast(iInfo(rec).status === 'paid' ? `${rec.num} is paid in full` : `${money(cents)} recorded. ${money(iInfo(rec).bal)} still owing.`); break;
    }
    case 'pay-rm': rec.payments = rec.payments.filter(p => p.id !== a.dataset.id); commit(); toast('Payment removed'); break;
    case 'del': {
      if (!arm(a, 'Tap again to delete')) break;
      const num = rec.num || rec.name || 'Client';
      if (type === 'job') { db.quotes.forEach(q => { if (q.jobId === rec.id) q.jobId = null; }); }
      if (type === 'invoice') { db.jobs.forEach(j => { if (j.invoiceId === rec.id) j.invoiceId = null; }); }
      db[COL[type]] = db[COL[type]].filter(x => x !== rec);
      state.sheet = null; state.returnTo = null; commit(); toast(`Deleted ${num}`); break;
    }
    case 'copy': copyText(a.dataset.text, a.dataset.what || 'Text'); break;
    case 'copy-doc': copyText(docText(type, rec), `${rec.num} text`); break;
    case 'copyfall-close': $('#copyfall').hidden = true; break;
    case 'reset': {
      if (!arm(a, 'Tap again to reset')) break;
      try { localStorage.removeItem(KEY); } catch (err) {}
      db = seed(); state.sheet = null; state.returnTo = null; renderAll(); toast('Sample data restored'); break;
    }
  }
});

document.addEventListener('input', e => {
  const t = e.target; const rec = getRec(); if (!rec) return;
  const row = t.closest('[data-item]');
  if (row && t.dataset.k) {
    const it = rec.items.find(i => i.id === row.dataset.item); if (!it) return;
    const k = t.dataset.k;
    it[k] = (k === 'qty' || k === 'rate') ? (parseFloat(t.value) || 0) : t.value;
    if (k === 'kind') { const u = row.querySelector('[data-k="unit"]'); const def = {labour:'hr', material:'ea', flat:'ea'}[t.value]; if (u && (!u.value || ['hr','ea'].includes(u.value))) { u.value = def; it.unit = def; } }
    row.querySelector('.amt').textContent = money(lineCents(it));
    const box = $('#sheet [data-totals]'); if (box) box.innerHTML = totalsHTML(rec, state.sheet.type);
    save(); return;
  }
  if (t.dataset.f) {
    let v = t.value;
    if (t.dataset.f === 'date' && !v) return;
    if (t.dataset.f === 'dueDays') v = +v;
    rec[t.dataset.f] = v; save();
    if (t.dataset.rerender !== undefined) { renderSheet(); }
    else if (state.sheet.type === 'client' && t.dataset.f === 'name') { const s = $('#sheet .sb-title span'); if (s) s.textContent = v || 'New client'; }
  }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset.chk) return;
  const rec = getRec(); const c = rec && rec.checklist.find(x => x.id === t.dataset.chk); if (!c) return;
  c.done = t.checked; commit();
  const again = document.getElementById(`ck-${c.id}`); if (again) again.focus({preventScroll:true});
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#copyfall').hidden) { $('#copyfall').hidden = true; return; } if (state.sheet) closeSheet(); }
  if (e.key === 'Enter' && e.target.id === 'chk-new') { e.preventDefault(); const b = $('#sheet [data-act="chk-add"]'); if (b) b.click(); }
});

function route() {
  const h = location.hash.slice(1);
  state.view = VIEWS[h] ? h : 'overview';
  renderTabs(); renderView();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
route();
})();
</script>
</body>
</html>
