<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fieldbook: quote, job, invoice and payment tracking for small trades and service businesses.">
<meta name="theme-color" content="#18232b">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Fieldbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field binder. Dark header band with tabs (bottom bar on phones), ledger-style rows,
   and each quote / work order / invoice opens as a paper form from a tear-off pad in a side sheet. */
:root{
  --paper:#eceee9; --surface:#fbfbf8; --sunk:#e2e5de; --ink:#18232b; --ink-2:#56636b; --line:#cfd5cc;
  --bar:#18232b; --bar-ink:#eef0ea; --bar-mute:#9fadb5;
  --accent:#c2410c; --accent-ink:#ffffff; --hl:#fff1a8;
  --ok:#2f7d3b; --ok-bg:#dcefdc; --info:#1d5f9e; --info-bg:#dde9f5;
  --warn:#8f5400; --warn-bg:#f8e8c8; --bad:#b42323; --bad-bg:#f6dcdc; --mute:#56636b; --mute-bg:#e2e5de;
  --age0:#3f7fbf; --age1:#d6a21e; --age2:#e07b2a; --age3:#c93a2e; --age4:#7d1d1d;
  --shadow:rgba(20,28,34,.22); --scrim:rgba(12,17,21,.45);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161a; --surface:#192026; --sunk:#222a31; --ink:#e6eae4; --ink-2:#9ba7ad; --line:#2f3a42;
  --bar:#0b0f12; --bar-ink:#e6eae4; --bar-mute:#8795a0;
  --accent:#ff8a4c; --accent-ink:#1d0c02; --hl:#3d3718;
  --ok:#7bd88a; --ok-bg:#1c3322; --info:#8cc4f5; --info-bg:#172a3b;
  --warn:#f5b85c; --warn-bg:#3a2a12; --bad:#ff8f8f; --bad-bg:#3d1c1c; --mute:#9ba7ad; --mute-bg:#262e35;
  --age0:#6fb2ec; --age1:#f0c04c; --age2:#ff9a52; --age3:#f06a6a; --age4:#b84444;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161a; --surface:#192026; --sunk:#222a31; --ink:#e6eae4; --ink-2:#9ba7ad; --line:#2f3a42;
  --bar:#0b0f12; --bar-ink:#e6eae4; --bar-mute:#8795a0;
  --accent:#ff8a4c; --accent-ink:#1d0c02; --hl:#3d3718;
  --ok:#7bd88a; --ok-bg:#1c3322; --info:#8cc4f5; --info-bg:#172a3b;
  --warn:#f5b85c; --warn-bg:#3a2a12; --bad:#ff8f8f; --bad-bg:#3d1c1c; --mute:#9ba7ad; --mute-bg:#262e35;
  --age0:#6fb2ec; --age1:#f0c04c; --age2:#ff9a52; --age3:#f06a6a; --age4:#b84444;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
.muted{color:var(--ink-2)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--bar);color:var(--bar-ink)}
.top-in{display:flex;align-items:center;gap:12px 14px;padding-block:14px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;flex:1;min-width:0}
.logo{display:inline-flex;align-items:center;gap:10px;font:700 26px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.logo i{display:inline-block;width:12px;height:22px;background:var(--accent);border-radius:2px 2px 0 0;transform:translateY(2px)}
.biz{font-size:13px;color:var(--bar-mute)}
.demo{font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--bar-ink);border:1px solid var(--bar-mute);border-radius:999px;padding:4px 8px}
.hdr-icon{color:var(--bar-mute)}
.hdr-icon:hover{background:transparent;color:var(--bar-ink)}
.tabs-in{display:flex;gap:4px}
.tab{position:relative;display:inline-flex;align-items:center;gap:8px;padding:10px 12px 12px;color:var(--bar-mute);text-decoration:none;font:600 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.tab:hover{color:var(--bar-ink)}
.tab.on{color:var(--bar-ink)}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--accent);border-radius:2px 2px 0 0}
.tab svg{display:none}
.badge{font:600 11px/1 var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 6px;letter-spacing:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1 var(--f-body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:transparent}
.btn.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--r);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn svg,.btn svg{width:18px;height:18px;flex:none}
.btn.sm svg{width:16px;height:16px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}

/* main */
main{padding-block:24px 56px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font:700 36px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--ink-2)}
.sec{font:600 14px/1 var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}

.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:20px 0 32px;padding:0;list-style:none}
.flow li{position:relative;display:flex}
.flow li:not(:last-child)::after{content:"";position:absolute;right:-15px;top:50%;width:9px;height:9px;border-top:2px solid var(--ink-2);border-right:2px solid var(--ink-2);transform:translateY(-50%) rotate(45deg);opacity:.6}
.stage{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit;min-width:0}
.stage:hover{border-color:var(--ink-2)}
.stage-k{display:flex;gap:8px;align-items:center;font:600 13px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.stage-k b{font:500 11px/1 var(--f-mono);color:var(--accent);letter-spacing:0}
.stage-v{font:600 32px/1.1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stage-s{font-size:13px;color:var(--ink-2)}

.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px;align-items:start}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list + .sec{margin-top:28px}
.empty{padding:28px 18px;color:var(--ink-2);text-align:center}

.att{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.att:first-child{border-top:0}
.att-text{min-width:0}
.att-sub{display:block;font-size:12px;color:var(--ink-2)}
.att .amt{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.att .linkish{color:inherit}

.jrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.jrow:first-child{border-top:0}
.jrow:hover,.row:hover{background:var(--sunk)}
.datebox{display:flex;flex-direction:column;align-items:center;justify-content:center;height:52px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.datebox b{font:700 22px/1 var(--f-display)}
.datebox small{font:600 10px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.jrow strong,.row strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jrow small,.row small{display:block;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .mono{font-size:12px;color:inherit;opacity:.75}

.row{display:grid;grid-template-columns:86px minmax(0,1fr) 96px 104px 120px;grid-template-areas:"num main date pill amt";align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.c-num{grid-area:num;font:500 13px var(--f-mono);color:var(--ink-2)}
.c-main{grid-area:main;min-width:0}
.c-date{grid-area:date;font-size:13px;color:var(--ink-2)}
.c-pill{grid-area:pill}
.c-amt{grid-area:amt;text-align:right;font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.c-amt small{font-family:var(--f-body)}
.void-amt{text-decoration:line-through;color:var(--ink-2)}
.row.client{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 80px 120px;grid-template-areas:"main date num amt"}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font:600 12px/1.6 var(--f-body);letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{color:var(--ok);background:var(--ok-bg)}
.t-info{color:var(--info);background:var(--info-bg)}
.t-warn{color:var(--warn);background:var(--warn-bg)}
.t-bad{color:var(--bad);background:var(--bad-bg)}
.t-mute{color:var(--mute);background:var(--mute-bg)}

/* aging report */
.aging{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;margin-bottom:20px}
.aging-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.aging-h .sec{margin:0}
.aging-tot{font:600 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.aging-bar{display:flex;gap:2px;height:14px;border-radius:3px;overflow:hidden;background:var(--sunk);margin:12px 0 14px}
.aging-bar span{min-width:6px}
.a0{background:var(--age0)}.a1{background:var(--age1)}.a2{background:var(--age2)}.a3{background:var(--age3)}.a4{background:var(--age4)}
.aging-legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.ag{display:grid;grid-template-columns:10px minmax(0,1fr);gap:2px 8px;align-items:center}
.ag .sw{width:10px;height:10px;border-radius:2px}
.ag-l{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);text-transform:uppercase}
.ag-v{grid-column:2;font-size:15px}
.ag-n{grid-column:2;font-size:12px;color:var(--ink-2)}
.ag.zero .ag-v{color:var(--ink-2)}

.foot{padding-block:8px 40px;color:var(--ink-2);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(820px,100%);background:var(--paper);z-index:50;display:flex;flex-direction:column;box-shadow:-16px 0 48px var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-bar{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.sb-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:600 15px var(--f-mono)}
.sb-sub{margin-left:auto;font-size:13px;color:var(--ink-2);text-align:right}
.sheet-body{flex:1;overflow-y:auto;padding:16px 20px 32px;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .spacer{flex:1}
.doc-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lock-note{margin:0 0 12px;font-size:13px;color:var(--ink-2)}

.paper{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:30px 28px 26px;box-shadow:0 14px 28px -22px var(--shadow)}
.paper::before{content:"";position:absolute;left:10px;right:10px;top:9px;height:6px;background:radial-gradient(circle,var(--paper) 2.5px,transparent 3px) 0 0/12px 6px repeat-x}
.paper-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.from-name{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.docid{text-align:right;margin-left:auto}
.doc-label{font:700 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.doc-num{font-size:15px;margin-top:4px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 24px;padding:16px 0;border-bottom:1px solid var(--line)}
.lbl{display:block;font:600 11px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.f{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 2px}
.f:hover{border-bottom-color:var(--ink-2)}
.f:focus{outline:none;border-bottom-color:var(--accent);background:var(--hl)}
select.f{cursor:pointer}
textarea.f{border:1px solid var(--line);border-radius:4px;min-height:76px;resize:vertical;padding:8px 10px;line-height:1.45}
.f.title{font:600 24px/1.2 var(--f-display);letter-spacing:.01em}
.doc-title{font:600 24px/1.2 var(--f-display);margin:0;text-wrap:balance}
.title-wrap{padding:16px 0 4px}

.items{margin-top:14px}
.items-h,.item{display:grid;grid-template-columns:minmax(0,1fr) 96px 54px 58px 76px 40px 88px 30px;gap:8px;align-items:center}
.items-h{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding-bottom:8px;border-bottom:1px solid var(--ink)}
.items-h .r,.item .amt{text-align:right}
.items-h .c{text-align:center}
.item{padding:4px 0;border-bottom:1px dashed var(--line)}
.item .f{border-bottom-color:transparent}
.item .f:hover{border-bottom-color:var(--line)}
.item .f:focus{border-bottom-color:var(--accent)}
.f.num{text-align:right;font-family:var(--f-mono);font-size:14px}
.item .amt{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.tx{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.tx input{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer}
.tx span{display:none}
.add-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.pb-label{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}

.ro-wrap{overflow-x:auto;margin-top:14px}
.ro{width:100%;border-collapse:collapse;font-size:14px}
.ro th{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:0 6px 8px;border-bottom:1px solid var(--ink)}
.ro td{padding:9px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.ro .r{text-align:right;white-space:nowrap}
.ro td.r{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ro small{display:block;color:var(--ink-2);font-size:12px}
.m-only{display:none!important}

.paper-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-top:16px}
.disc{display:flex;gap:6px;align-items:flex-end}
.disc select.f{width:58px}
.disc input.f{width:96px}
.totals{margin-left:auto;width:min(320px,100%);display:grid;gap:5px}
.tot-row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.tot-row small{color:var(--ink-2);font-size:12px}
.tot-row .mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.tot-row.grand{border-top:2px solid var(--ink);padding-top:8px;margin-top:4px;font-weight:600;font-size:17px}
.tot-row.credit{color:var(--ok)}
.mix{font-size:12px;color:var(--ink-2);text-align:right}
.stamp{align-self:center;transform:rotate(-8deg);border:3px solid currentColor;border-radius:6px;padding:6px 16px 4px;font:700 30px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin:6px 0 0 6px}
.stamp small{display:block;font:600 11px/1.4 var(--f-mono);letter-spacing:.04em;text-align:center}
.stamp.t-ok,.stamp.t-bad,.stamp.t-info,.stamp.t-mute{background:transparent}
.notes{margin-top:18px}
.notes p{margin:0;white-space:pre-wrap}
.terms{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);display:grid;gap:2px}

.panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel h3{font:600 14px/1 var(--f-display);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin:0 0 10px}
.panel p{margin:10px 0 0}
.check{display:flex;align-items:center;gap:10px;padding:5px 0}
.check input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
.check label{flex:1;cursor:pointer}
.check.done label{text-decoration:line-through;color:var(--ink-2)}
.inline-add{display:flex;gap:8px;margin-top:8px}
.inline-add .f{flex:1}
.pay{display:grid;grid-template-columns:70px minmax(0,1fr) auto 30px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.pay-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;margin-top:12px}
.late{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;padding:10px 12px;border-radius:var(--r);background:var(--bad-bg);font-size:14px}
.late strong{color:var(--bad)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.log li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;font-size:14px}
.log li span:first-child{color:var(--ink-2);font-size:13px}
.contact{display:grid;gap:2px;align-content:start}
.copyline{display:flex;align-items:center;gap:6px}
.field{display:grid;gap:2px;align-content:start}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--bar);color:var(--bar-ink);padding:10px 18px;border-radius:999px;font-weight:500;z-index:90;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.copyfall{position:fixed;inset:auto 0 0 0;z-index:95;background:var(--surface);border-top:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -12px 32px var(--shadow)}
.copyfall textarea{width:100%;height:180px;font:13px/1.45 var(--f-mono);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px}
.copyfall div{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}

@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .flow{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .flow li::after{display:none}
  .stage-v{font-size:26px}
}
@media (max-width:700px){
  .top-in{padding-block:12px}
  .top .btn.primary{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
  .tab{flex-direction:column;gap:4px;padding:9px 2px 8px;color:var(--ink-2);font:600 12px/1 var(--f-body);letter-spacing:.02em;text-transform:none}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--accent)}
  .tab.on::after{top:0;bottom:auto;left:22%;right:22%;border-radius:0 0 2px 2px}
  .tab svg{display:block;width:22px;height:22px}
  .tab .badge{position:absolute;top:5px;left:calc(50% + 6px);padding:2px 5px;font-size:10px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .foot{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));margin-top:-72px}
  h1{font-size:30px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .sheet{padding-left:env(safe-area-inset-left,0px)}
  .aging-legend{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"num pill" "main main" "date amt";row-gap:4px}
  .row.client{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main amt" "date num"}
  .att{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"pill amt" "text text" "btn btn"}
  .att .pill{grid-area:pill;justify-self:start}.att .amt{grid-area:amt}.att-text{grid-area:text}.att .btn{grid-area:btn;justify-self:start}
  .sheet-body{padding:12px 12px 28px}
  .paper{padding:26px 16px 20px}
  .doc-label{font-size:24px}
  .items-h{display:none}
  .item{grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr) minmax(0,.7fr) minmax(0,.9fr);padding:8px 0}
  .item .desc{grid-column:1/-1}
  .item .tx{grid-column:1;justify-content:flex-start}
  .item .tx span{display:inline}
  .item .amt{grid-column:2/4}
  .item .icon-btn{justify-self:end}
  .ro .d-only{display:none}
  .m-only{display:block!important}
  .pay-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pay-form .btn{grid-column:1/-1}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .stamp{font-size:24px}
  .sb-sub{display:none}
  .aging-legend{grid-template-columns:minmax(0,1fr);gap:6px}
  .ag{grid-template-columns:10px minmax(0,1fr) auto}
  .ag-v{grid-column:auto;font-size:14px}
  .ag-n{display:none}
}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.toast{transition:none}}
@media print{
  :root:not(#print-light),:root[data-theme]{--paper:#fff;--surface:#fff;--sunk:#f2f2f2;--ink:#111;--ink-2:#555;--line:#ccc;--accent:#b83a0a;--hl:transparent;--ok:#2f7d3b;--bad:#b42323;--mute:#555;--info:#1d5f9e;color-scheme:light}
  body{background:#fff}
  @page{margin:16mm}
  .top,#view,.foot,.scrim,.toast,.copyfall,.tabs,.sheet-bar,.sheet-foot,.panel,.doc-tools,.add-line,.lock-note,.item .icon-btn,.disc,.copyline .icon-btn{display:none!important}
  .linkish{color:inherit;text-decoration:none}
  body.locked{overflow:visible}
  .sheet{position:static;width:auto;box-shadow:none;background:#fff;animation:none;padding:0;display:block}
  .sheet-body{overflow:visible;padding:0}
  .paper{border:0;box-shadow:none;padding:0}
  .paper::before{display:none}
  .f{border:0!important;background:transparent!important;-webkit-appearance:none;appearance:none}
}

/* ---------- invoice math ---------- */
const paidOf = inv => inv.payments.reduce((s, p) => s + p.cents, 0);
const lastPayDate = inv => inv.payments.map(p => p.date).sort().pop();
function depositsFor(inv) {
  if (inv.kind === 'deposit') return [];
  const job = inv.jobId && byId(db.jobs, inv.jobId);
  const qid = inv.quoteId || (job && job.quoteId);
  return db.invoices.filter(d => d.kind === 'deposit' && !d.void && ((qid && d.quoteId === qid) || (inv.jobId && d.jobId === inv.jobId)))
    .map(d => ({inv:d, cents:paidOf(d)})).filter(x => x.cents > 0);
}
function iInfo(inv) {
  const t = totals(inv);
  const paid = paidOf(inv);
  const deps = depositsFor(inv);
  const dep = deps.reduce((s, d) => s + d.cents, 0);
  const due = addDays(inv.date, +inv.dueDays || 0);
  const bal = t.total - dep - paid;
  const daysOver = Math.max(0, daysBetween(due, TODAY));
  let status;
  if (inv.void) status = 'void';
  else if (t.total > 0 && bal <= 0) status = 'paid';
  else if (!inv.sent) status = 'draft';
  else if (daysOver > 0) status = 'overdue';
  else if (paid > 0 || dep > 0) status = 'partial';
  else status = 'sent';
  return {...t, paid, deps, dep, bal, due, daysOver, status};
}
const isOpen = x => ['sent','partial','overdue'].includes(x.status);
const depositOf = (qid, jid) => db.invoices.find(d => d.kind === 'deposit' && !d.void && ((qid && d.quoteId === qid) || (jid && d.jobId === jid)));

function agingHTML(infos) {
  const B = [['Current'],['1–30 days'],['31–60 days'],['61–90 days'],['90+ days']].map(([l]) => ({l, c:0, n:0}));
  infos.forEach(([, x]) => {
    if (!isOpen(x) || x.bal <= 0) return;
    const d = x.daysOver, k = d <= 0 ? 0 : d <= 30 ? 1 : d <= 60 ? 2 : d <= 90 ? 3 : 4;
    B[k].c += x.bal; B[k].n++;
  });
  const tot = B.reduce((s, b) => s + b.c, 0);
  if (!tot) return '';
  return `<section class="aging" aria-label="Unpaid invoices by age">
    <div class="aging-h"><h2 class="sec">Who owes you, by age</h2><span class="aging-tot">${money(tot)}</span></div>
    <div class="aging-bar" role="img" aria-label="${B.filter(b => b.c).map(b => `${b.l}: ${money(b.c)}`).join(', ')}">${B.map((b, i) => b.c ? `<span class="a${i}" style="flex:${b.c} 1 0" title="${b.l}: ${money(b.c)}"></span>` : '').join('')}</div>
    <div class="aging-legend">${B.map((b, i) => `<div class="ag${b.c ? '' : ' zero'}"><span class="sw a${i}"></span><span class="ag-l">${b.l}</span><span class="ag-v mono">${money(b.c)}</span><span class="ag-n">${b.n ? plural(b.n, 'invoice') : 'None'}</span></div>`).join('')}</div>

}

  return `<div class="ro-wrap"><table class="ro"><thead><tr><th>Description</th><th class="r d-only">Qty</th><th class="r d-only">Rate</th><th class="r">Amount</th></tr></thead><tbody>
    ${r.items.length ? r.items.map(it => `<tr><td>${esc(it.desc || '(no description)')}<small class="d-only">${KINDS[it.kind] || ''}${it.taxable === false ? ' · no tax' : ''}</small><small class="m-only">${it.qty} ${esc(it.unit)} × ${money(it.rate * 100)}${it.taxable === false ? ' · no tax' : ''}</small></td><td class="r d-only">${it.qty} ${esc(it.unit)}</td><td class="r d-only">${money(it.rate * 100)}</td><td class="r">${money(lineCents(it))}</td></tr>`).join('') : `<tr><td colspan="4" class="muted">No line items.</td></tr>`}
  </tbody></table></div>`;
}
const trow = (l, v, c = '') => `<div class="tot-row ${c}"><span>${l}</span><span class="mono">${v}</span></div>`;
function totalsHTML(r, type) {
  const t = totals(r);
  let html = trow('Subtotal', money(t.sub));
  if (t.disc) html += trow(`Discount${r.discount.mode === 'pct' ? ` (${fmtRate(r.discount.value)}%)` : ''}`, '−' + money(t.disc));
  if (t.taxableSub > 0) t.taxes.forEach(x => { html += trow(`${x.label} ${fmtRate(x.rate)}%${t.taxBase !== t.sub - t.disc ? ` <small>on ${money(t.taxBase)}</small>` : ''}`, money(x.cents)); });
  html += trow('Total', money(t.total), 'grand');
  if (type === 'invoice') {
    const x = iInfo(r);
    x.deps.forEach(d => { html += trow(`Deposit received <small>${esc(d.inv.num)}</small>`, '−' + money(d.cents), 'credit'); });
    if (x.paid) html += trow('Paid', '−' + money(x.paid), 'credit');
    if (x.paid || x.dep) html += trow('Balance due', money(Math.max(0, x.bal)), 'grand');
  }
  const mix = Object.keys(KINDS).map(k => [KINDS[k], r.items.filter(i => i.kind === k).reduce((s, i) => s + lineCents(i), 0)]).filter(([, v]) => v);
  if (mix.length > 1) html += `<div class="mix">${mix.map(([l, v]) => `${l} ${money(v)}`).join(' · ')}</div>`;
  if (r.kind === 'deposit') html += `<div class="mix">No tax on deposits. Tax is charged on the final invoice.</div>`;
  return html;
}
const stamp = (text, tone, sub) => `<div class="stamp t-${tone}" aria-label="${text}">${text}${sub ? `<small>${sub}</small>` : ''}</div>`;
const discHTML = r => { const d = r.discount || {mode:'pct', value:''}; return `<div class="field"><label class="lbl" for="f-disc-v">Discount</label><div class="disc"><select class="f" id="f-disc-m" data-disc="mode" aria-label="Discount type"><option value="pct"${d.mode !== 'amt' ? ' selected' : ''}>%</option><option value="amt"${d.mode === 'amt' ? ' selected' : ''}>$</option></select><input class="f num" id="f-disc-v" data-disc="value" type="number" inputmode="decimal" min="0" step="0.5" value="${d.value || ''}" placeholder="0"></div></div>`; };
const paperFoot = (r, type, left) => `<div class="paper-foot">${left || '<span></span>'}<div class="totals" data-totals>${totalsHTML(r, type)}</div></div>`;
function notesBlock(r, editable, label, ph) {
  if (editable) return `<div class="notes"><label class="lbl" for="f-notes">${label}</label><textarea class="f" id="f-notes" data-f="notes" placeholder="${ph}">${esc(r.notes)}</textarea></div>`;
  return r.notes ? `<div class="notes"><span class="lbl">${label}</span><p>${esc(r.notes)}</p></div>` : '';
}
const bar = (num, pillHTML, sub) => `<div class="sheet-bar"><button class="icon-btn" data-act="close" aria-label="Close">${ICON.x}</button><div class="sb-title"><span>${esc(num)}</span>${pillHTML}</div><span class="sb-sub">${sub || ''}</span></div>`;
const delBtn = what => `<button class="btn danger" data-act="del" id="del-btn">Delete ${what}</button>`;
const docTools = (extra = '') => `<div class="doc-tools">${extra}<button class="btn sm" data-act="copy-doc">${ICON.copy}Copy as text</button>${canPrint ? `<button class="btn sm" data-act="print">${ICON.print}Print or save PDF</button>` : ''}</div>`;
function depositBlock(src, type) {
  const qid = type === 'quote' ? src.id : src.quoteId;
  const jid = type === 'job' ? src.id : src.jobId;
  const d = depositOf(qid, jid);
  if (d) return `<div class="contact"><span class="lbl">Deposit</span><span><button class="linkish" data-open="invoice:${d.id}">${esc(d.num)}</button> · ${money(totals(d).total)}</span><span>${pill('invoice', iInfo(d).status)}</span></div>`;
  const pct = +db.settings.depositPct;
  const eligible = type === 'quote' ? src.status === 'accepted' : (src.status !== 'done' && !src.invoiceId);
  if (!eligible || !(pct > 0) || !totals(src).total) return '';
  return `<div class="contact"><span class="lbl">Deposit</span><button class="linkish" data-act="deposit">Request ${fmtRate(pct)}% deposit · ${money(Math.round(totals(src).total * pct / 100))}</button><span class="small muted">Credited on the final invoice</span></div>`;
}

/* ---------- sheets ---------- */
function sheetQuote(q) {
  const ed = q.status === 'draft';
  const job = q.jobId && byId(db.jobs, q.jobId);
  const left = ed ? discHTML(q) : q.status === 'accepted' ? stamp('Accepted', 'ok', q.acceptedOn ? fmtDate(q.acceptedOn) : '') : q.status === 'declined' ? stamp('Declined', 'bad') : '';
  let foot;
  if (q.status === 'draft') foot = `${delBtn('quote')}<span class="spacer"></span><button class="btn primary" data-act="q-send">Mark as sent</button>`;
  else if (q.status === 'sent') foot = `<button class="btn ghost" data-act="q-draft">Edit quote</button><span class="spacer"></span><button class="btn" data-act="q-decline">Client declined</button><button class="btn primary" data-act="q-accept">Client accepted</button>`;
  else if (q.status === 'accepted') foot = `<span class="spacer"></span>${job ? `<button class="btn primary" data-open="job:${job.id}">Open ${esc(job.num)}</button>` : `<button class="btn primary" data-act="q-schedule">Schedule job</button>`}`;
  else foot = `${delBtn('quote')}<span class="spacer"></span><button class="btn" data-act="q-draft">Reopen as draft</button>`;
  const sub = q.status === 'sent' && q.sentOn ? `Sent ${relDay(q.sentOn).toLowerCase()}` : q.status === 'draft' ? 'Changes save automatically' : '';
  return `${bar(q.num, pill('quote', q.status), sub)}
  <div class="sheet-body">
    ${docTools()}
    ${q.status === 'sent' ? `<p class="lock-note">This quote has been sent, so it's locked. Choose <strong>Edit quote</strong> to revise it and send it again.</p>` : ''}
    <article class="paper">
      ${paperHead('Quote', q.num, `<div class="small muted">Issued ${fmtLong(q.date)}</div><div class="small muted">Valid until ${fmtLong(addDays(q.date, 30))}</div>`)}
      <div class="meta">${clientBlock(q, ed, 'Prepared for')}
        ${job ? `<div class="contact"><span class="lbl">Work order</span><button class="linkish" data-open="job:${job.id}">${esc(job.num)} · ${fmtDate(job.date)}</button></div>` : ''}
        ${depositBlock(q, 'quote')}</div>
      ${titleBlock(q, ed, 'What is the job? e.g. Kitchen backsplash')}
      ${itemsBlock(q, ed)}
      ${paperFoot(q, 'quote', left)}
      ${notesBlock(q, ed, 'Notes & exclusions', 'What is and isn’t included, timing, access…')}
      <div class="terms"><span>Prices in CAD. ${taxSummary(q.taxes || docTaxes())} applies where marked. Quote valid for 30 days.</span>${+db.settings.depositPct > 0 ? `<span>A ${fmtRate(db.settings.depositPct)}% deposit may be requested to book the work.</span>` : ''}<span>To accept, reply to this quote or call ${esc(db.settings.phone)}.</span></div>
    </article>
  </div>
  <div class="sheet-foot">${foot}</div>`;
}

function sheetJob(j) {
  const ed = !j.invoiceId;
  const quote = j.quoteId && byId(db.quotes, j.quoteId);
  const invc = j.invoiceId && byId(db.invoices, j.invoiceId);
  const doneCount = j.checklist.filter(c => c.done).length;
  let foot;
  if (j.status === 'scheduled') foot = `${ed ? delBtn('job') : ''}<span class="spacer"></span><button class="btn" data-act="j-start">Start job</button><button class="btn primary" data-act="j-done">Mark done</button>`;
  else if (j.status === 'in_progress') foot = `<button class="btn ghost" data-act="j-reopen">Back to scheduled</button><span class="spacer"></span><button class="btn primary" data-act="j-done">Mark done</button>`;
  else if (!invc) foot = `<button class="btn ghost" data-act="j-reopen">Reopen job</button><span class="spacer"></span><button class="btn primary" data-act="j-invoice">Create invoice</button>`;
  else foot = `<span class="spacer"></span><button class="btn primary" data-open="invoice:${invc.id}">Open ${esc(invc.num)}</button>`;
  return `${bar(j.num, pill('job', j.status), relDay(j.date))}
  <div class="sheet-body">
    ${docTools()}
    <article class="paper">
      ${paperHead('Work order', j.num, `<label class="small muted" for="f-date" style="display:block;margin-top:6px">Scheduled</label><input class="f mono" type="date" id="f-date" data-f="date" data-rerender value="${j.date}" style="max-width:170px;text-align:right">`)}
      <div class="meta">${clientBlock(j, ed && !quote, 'Client & site')}
        <div class="contact"><span class="lbl">Paperwork</span>
          ${quote ? `<span>Quote <button class="linkish" data-open="quote:${quote.id}">${esc(quote.num)}</button></span>` : `<span class="muted small">No quote. Booked directly.</span>`}
          ${invc ? `<span>Invoice <button class="linkish" data-open="invoice:${invc.id}">${esc(invc.num)}</button></span>` : ''}</div>
        ${depositBlock(j, 'job')}</div>
      ${titleBlock(j, ed, 'What is the job?')}
      ${ed ? `<p class="small muted" style="margin:4px 0 0">Add extra work or parts found on site. Everything here carries over to the invoice.</p>` : ''}
      ${itemsBlock(j, ed)}
      ${paperFoot(j, 'job', ed ? discHTML(j) : j.status === 'done' ? stamp('Complete', 'ok', fmtDate(j.date)) : '')}
    </article>
    <section class="panel"><h3>Checklist · ${doneCount}/${j.checklist.length}</h3>
      ${j.checklist.map(c => `<div class="check${c.done ? ' done' : ''}"><input type="checkbox" id="ck-${c.id}" data-chk="${c.id}"${c.done ? ' checked' : ''}><label for="ck-${c.id}">${esc(c.t)}</label><button class="icon-btn sm" data-act="chk-rm" data-id="${c.id}" aria-label="Remove checklist item">${ICON.x}</button></div>`).join('')}
      <div class="inline-add"><input class="f" id="chk-new" placeholder="Add a step, e.g. Pick up permit" aria-label="New checklist step"><button class="btn sm" data-act="chk-add">Add</button></div>
    </section>
    <section class="panel"><h3><label for="f-notes">Site notes</label></h3><textarea class="f" id="f-notes" data-f="notes" placeholder="Door codes, parking, pets, paint colours…">${esc(j.notes)}</textarea></section>
  </div>
  <div class="sheet-foot">${foot}</div>`;
}

function lateFeeHTML(inv, x) {
  const r = +db.settings.lateRate;
  if (x.status !== 'overdue' || !(r > 0)) return '';
  const last = inv.items.filter(i => i.fee).map(i => i.feeDate).sort().pop();
  const wait = last ? 30 - daysBetween(last, TODAY) : 0;
  const fee = Math.round(x.bal * r / 100);
  return `<div class="late"><span><strong>${plural(x.daysOver, 'day')} overdue.</strong> Your late fee is ${fmtRate(r)}% per month on the unpaid balance.</span>
    ${wait > 0 ? `<span class="small">Late fee added ${fmtDate(last)}. The next one can be added ${fmtDate(addDays(last, 30))}.</span>` : `<button class="btn sm" data-act="i-latefee">Add late fee · ${money(fee)}</button>`}</div>`;
}
function sheetInvoice(inv) {
  const x = iInfo(inv);
  const ed = x.status === 'draft';
  const job = inv.jobId && byId(db.jobs, inv.jobId);
  const quote = inv.quoteId && byId(db.quotes, inv.quoteId);
  const left = ed ? discHTML(inv) : x.status === 'paid' ? stamp('Paid', 'ok', fmtDate(lastPayDate(inv) || TODAY)) : x.status === 'overdue' ? stamp('Overdue', 'bad', plural(x.daysOver, 'day')) : x.status === 'void' ? stamp('Void', 'mute') : '';
  const terms = ed ? `<label class="small muted" for="f-terms" style="display:block;margin-top:6px">Terms</label><select class="f" id="f-terms" data-f="dueDays" data-num data-rerender style="max-width:170px">${TERMS.map(([v, l]) => `<option value="${v}"${+inv.dueDays === v ? ' selected' : ''}>${l}</option>`).join('')}</select>` : '';
  const canVoid = !inv.payments.length;
  const voidBtn = `<button class="btn danger" data-act="i-void" id="void-btn">Void invoice</button>`;
  let foot;
  if (x.status === 'void') foot = `<span class="spacer"></span><button class="btn" data-act="close">Close</button>`;
  else if (ed) foot = `${inv.everSent ? voidBtn : delBtn('invoice')}<span class="spacer"></span><button class="btn primary" data-act="i-send">Mark as sent</button>`;
  else if (x.status === 'paid') foot = `<span class="spacer"></span>${job ? `<button class="btn" data-open="job:${job.id}">Open ${esc(job.num)}</button>` : ''}<button class="btn" data-act="close">Close</button>`;
  else foot = `${canVoid ? `<button class="btn ghost" data-act="i-draft">Edit invoice</button>${voidBtn}` : ''}<span class="spacer"></span><button class="btn primary" data-act="pay-full">Paid in full · ${money(x.bal)}</button>`;
  const sub = ed ? 'Changes save automatically' : isOpen(x) ? `Due ${relDay(x.due).toLowerCase()}` : '';
  const s = db.settings;
  const payments = (ed || x.status === 'void') ? '' : `<section class="panel"><h3>Payments</h3>
      ${x.deps.map(d => `<div class="pay"><span class="mono small">${fmtDate(lastPayDate(d.inv))}</span><span>Deposit <button class="linkish" data-open="invoice:${d.inv.id}">${esc(d.inv.num)}</button></span><span class="mono">${money(d.cents)}</span><span></span></div>`).join('')}
      ${inv.payments.map(p => `<div class="pay"><span class="mono small">${fmtDate(p.date)}</span><span>${esc(p.method)}</span><span class="mono">${money(p.cents)}</span><button class="icon-btn sm" data-act="pay-rm" data-id="${p.id}" aria-label="Remove payment">${ICON.x}</button></div>`).join('')}
      ${inv.payments.length || x.deps.length ? '' : `<p class="small muted" style="margin:0">No payments recorded yet.</p>`}
      ${x.bal > 0 ? `<div class="pay-form">
        <div class="field"><label class="lbl" for="pay-amt">Amount</label><input class="f num" id="pay-amt" type="number" inputmode="decimal" step="0.01" min="0" value="${(x.bal / 100).toFixed(2)}"></div>
        <div class="field"><label class="lbl" for="pay-method">Method</label><select class="f" id="pay-method">${METHODS.map(m => `<option>${m}</option>`).join('')}</select></div>
        <div class="field"><label class="lbl" for="pay-date">Received</label><input class="f mono" id="pay-date" type="date" value="${TODAY}"></div>
        <button class="btn" data-act="pay">Record payment</button></div>` : ''}
      ${lateFeeHTML(inv, x)}
    </section>`;
  return `${bar(inv.num, pill('invoice', x.status), sub)}
  <div class="sheet-body">
    ${docTools(isOpen(x) ? `<button class="btn sm" data-act="i-remind">${ICON.bell}Copy ${x.status === 'overdue' ? 'overdue' : 'friendly'} reminder</button>` : '')}
    ${x.status === 'void' ? `<p class="lock-note">This invoice was voided. It stays on file so your invoice numbers have no gaps, but it no longer counts toward what you're owed.</p>` : isOpen(x) ? `<p class="lock-note">Sent invoices are locked. ${canVoid ? 'Choose <strong>Edit invoice</strong> to change it, or void it and start a new one.' : 'It has payments recorded, so it can no longer be edited.'}</p>` : ''}
    <article class="paper">
      ${paperHead(inv.kind === 'deposit' ? 'Deposit' : 'Invoice', inv.num, `<div class="small muted">Issued ${fmtLong(inv.date)}</div><div class="small${x.status === 'overdue' ? '' : ' muted'}"${x.status === 'overdue' ? ' style="color:var(--bad);font-weight:600"' : ''}>${+inv.dueDays ? `Due ${fmtLong(x.due)}` : 'Due on receipt'}</div>${terms}`)}
      <div class="meta">${clientBlock(inv, ed && !job, 'Bill to')}
        ${job || quote ? `<div class="contact"><span class="lbl">${inv.kind === 'deposit' ? 'To book' : 'For work order'}</span>${job ? `<span><button class="linkish" data-open="job:${job.id}">${esc(job.num)}</button>${job.status === 'done' ? ` <span class="small muted">completed ${fmtDate(job.date)}</span>` : ` <span class="small muted">${fmtDate(job.date)}</span>`}</span>` : ''}${quote ? `<span class="small">Quote <button class="linkish" data-open="quote:${quote.id}">${esc(quote.num)}</button></span>` : ''}</div>` : ''}</div>
      ${titleBlock(inv, ed, 'What was the work?')}
      ${itemsBlock(inv, ed)}
      ${paperFoot(inv, 'invoice', left)}
      ${notesBlock(inv, ed, 'Notes', 'Thank-you note, warranty info…')}
      <div class="terms"><span>Pay by e-Transfer to <span class="mono">${esc(s.etransfer)}</span> (auto-deposit on). Cheques payable to ${esc(s.name)}.</span>${+s.lateRate > 0 && inv.kind !== 'deposit' ? `<span>Overdue balances are charged ${fmtRate(s.lateRate)}% per month.</span>` : ''}</div>
    </article>
    ${payments}
    <section class="panel"><h3>Activity</h3><ol class="log">${[...(inv.log || [])].reverse().map(e => `<li><span class="mono">${fmtDate(e.date)}</span><span>${esc(e.text)}</span></li>`).join('')}</ol></section>
  </div>
  <div class="sheet-foot">${foot}</div>`;
}

function sheetClient(c) {
  const s = clientStats(c);
  const back = state.returnTo && byId(db[COL[state.returnTo.type]], state.returnTo.id);
  const hist = [
    ...db.quotes.filter(q => q.clientId === c.id).map(q => ({t:'quote', r:q, d:q.date, st:pill('quote', q.status), amt:totals(q).total})),
    ...db.jobs.filter(j => j.clientId === c.id).map(j => ({t:'job', r:j, d:j.date, st:pill('job', j.status), amt:totals(j).total})),
    ...db.invoices.filter(i => i.clientId === c.id).map(i => ({t:'invoice', r:i, d:i.date, st:pill('invoice', iInfo(i).status), amt:totals(i).total})),
  ].sort((a, b) => b.d.localeCompare(a.d));
  const field = (k, l, type = 'text', ph = '') => `<div class="field"><label class="lbl" for="cl-${k}">${l}</label><input class="f" id="cl-${k}" type="${type}" data-f="${k}" value="${esc(c[k])}" placeholder="${ph}"></div>`;
  const foot = back
    ? `<span class="spacer"></span><button class="btn primary" data-act="close">Use for ${esc(back.num)}</button>`
    : `${s.records ? '' : delBtn('client')}<span class="spacer"></span><button class="btn primary" data-act="new-quote" data-client="${c.id}">New quote</button>`;
  return `${bar(c.name || 'New client', '', s.owing ? `${money(s.owing)} owing` : '')}
  <div class="sheet-body">
    <section class="panel" style="margin-top:0"><h3>Contact</h3>
      <div class="form-grid">${field('name', 'Name or business', 'text', 'e.g. Sam Patel')}${field('phone', 'Phone', 'tel', '905-555-0123')}${field('email', 'Email', 'email', 'name@example.com')}${field('address', 'Site address', 'text', 'Street, town')}</div>
    </section>
    <section class="panel"><h3>History · ${money(s.billed)} billed</h3>
      ${hist.length ? `<div class="list">${hist.map(h => `<button class="row" data-open="${h.t}:${h.r.id}"><span class="c-num">${esc(h.r.num)}</span><span class="c-main"><strong>${esc(h.r.title || 'Untitled')}</strong><small>${h.t === 'job' ? 'Work order' : h.t[0].toUpperCase() + h.t.slice(1)}</small></span><span class="c-date">${fmtDate(h.d)}</span><span class="c-pill">${h.st}</span><span class="c-amt">${money(h.amt)}</span></button>`).join('')}</div>` : `<p class="small muted" style="margin:0">No quotes, jobs or invoices yet.</p>`}
    </section>
  </div>
  <div class="sheet-foot">${foot}</div>`;
}

function sheetSettings(s) {
  const f = (k, l, type = 'text', ph = '', extra = '') => `<div class="field"><label class="lbl" for="st-${k}">${l}</label><input class="f" id="st-${k}" type="${type}" data-f="${k}" ${extra} value="${esc(s[k])}" placeholder="${ph}"></div>`;
  const p = PROVINCES[s.province] || PROVINCES.ON;
  return `${bar('Settings', '', '')}
  <div class="sheet-body">
    <section class="panel" style="margin-top:0"><h3>Your business</h3>
      <div class="form-grid">${f('name', 'Business name')}${f('addr', 'City and province')}${f('phone', 'Phone', 'tel')}${f('email', 'Email', 'email')}${f('hst', 'GST/HST registration number', 'text', '12345 6789 RT0001')}${f('etransfer', 'e-Transfer email', 'email')}</div>
    </section>
    <section class="panel"><h3>Sales tax</h3>
      <div class="form-grid">
        <div class="field"><label class="lbl" for="st-province">Province or territory</label><select class="f" id="st-province" data-f="province" data-rerender>${Object.entries(PROVINCES).map(([k, v]) => `<option value="${k}"${k === s.province ? ' selected' : ''}>${v.name}</option>`).join('')}</select></div>
        <div class="field"><span class="lbl">Charged on new documents</span><span class="mono">${taxSummary(p.taxes)}</span></div>
      </div>
      <p class="small muted">Quotes and invoices you've already made keep the rate they were created with. You can turn tax off for any line, for example owner-supplied parts or interest charges. Rules for PST on labour vary by province, so check with your accountant.</p>
    </section>
    <section class="panel"><h3>Invoicing</h3>
      <div class="form-grid">
        <div class="field"><label class="lbl" for="st-terms">Default payment terms</label><select class="f" id="st-terms" data-f="terms" data-num>${TERMS.map(([v, l]) => `<option value="${v}"${+s.terms === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
        ${f('lateRate', 'Late fee, % per month', 'number', '2', 'data-num step="0.5" min="0" inputmode="decimal"')}
        ${f('depositPct', 'Deposit, % of quote total', 'number', '30', 'data-num step="5" min="0" max="100" inputmode="decimal"')}
      </div>
      <p class="small muted">Set the late fee or deposit to 0 to turn it off.</p>
    </section>
  </div>
  <div class="sheet-foot"><span class="spacer"></span><button class="btn primary" data-act="close">Done</button></div>`;
}

const SHEETS = {quote:sheetQuote, job:sheetJob, invoice:sheetInvoice, client:sheetClient, settings:sheetSettings};
function renderSheet() {
  const el = $('#sheet');
  const rec = getRec();
  if (!state.sheet || !rec) {
    state.sheet = null; el.hidden = true; el.innerHTML = ''; $('#scrim').hidden = true; document.body.classList.remove('locked'); return;
  }
  const old = el.querySelector('.sheet-body'); const top = old ? old.scrollTop : 0;
  el.innerHTML = SHEETS[state.sheet.type](rec);
  el.hidden = false; $('#scrim').hidden = false; document.body.classList.add('locked');
  const nb = el.querySelector('.sheet-body'); if (nb) nb.scrollTop = top;
}
function openSheet(type, id) {
  if (state.sheet && state.sheet.type === 'client' && type !== 'client') cleanupClient();
  state.sheet = {type, id};
  renderSheet();
  const b = $('#sheet .sheet-body'); if (b) b.scrollTop = 0;
  const c = $('#sheet [data-act="close"]'); if (c) c.focus({preventScroll:true});
}
function cleanupClient() {
  const c = getRec();
  if (c && !c.name.trim() && !clientStats(c).records) { db.clients = db.clients.filter(x => x !== c); save(); }
}
function closeSheet() {
  if (state.sheet && state.sheet.type === 'client') {
    const c = getRec();
    cleanupClient();
    if (state.returnTo) {
      const back = byId(db[COL[state.returnTo.type]], state.returnTo.id);
      const rt = state.returnTo; state.returnTo = null;
      if (back) { if (c && byId(db.clients, c.id)) { back.clientId = c.id; save(); } renderTabs(); renderView(); openSheet(rt.type, rt.id); return; }
    }
  }
  state.sheet = null; state.returnTo = null;
  renderSheet(); renderHeader(); renderTabs(); renderView();
}

/* ---------- actions ---------- */
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }
function commit() { save(); renderTabs(); renderView(); renderSheet(); }
function arm(btn, label) {
  if (btn.dataset.armed) return true;
  const old = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; btn.classList.remove('armed'); } }, 3500);
  return false;
}
function copyText(text, msg) {
  const fallback = () => { const box = $('#copyfall'); const ta = $('#copyfall-text'); ta.value = text; box.hidden = false; ta.focus(); ta.select(); };
  try {
    if (!navigator.clipboard) throw new Error('no clipboard');
    navigator.clipboard.writeText(text).then(() => toast(msg), fallback);
  } catch (e) { fallback(); }
}
function docText(type, r) {
  const s = db.settings;
  const label = {quote:'Quote', job:'Work order', invoice: r.kind === 'deposit' ? 'Deposit invoice' : 'Invoice'}[type];
  const c = client(r.clientId), t = totals(r);
  const out = [`${label} ${r.num} from ${s.name}`];
  if (r.title) out.push(r.title);
  out.push(`For: ${c.name}${c.address ? ', ' + c.address : ''}`, `Date: ${fmtLong(r.date)}`);
  const x = type === 'invoice' ? iInfo(r) : null;
  if (x) out.push(+r.dueDays ? `Due: ${fmtLong(x.due)}` : 'Due on receipt');
  out.push('');
  r.items.forEach(it => out.push(`${it.qty} ${it.unit}  ${it.desc || '(no description)'} @ ${money(it.rate * 100)} = ${money(lineCents(it))}${it.taxable === false ? ' (no tax)' : ''}`));
  out.push('', `Subtotal: ${money(t.sub)}`);
  if (t.disc) out.push(`Discount: -${money(t.disc)}`);
  if (t.taxableSub > 0) t.taxes.forEach(tx => out.push(`${tx.label} ${fmtRate(tx.rate)}%: ${money(tx.cents)}`));
  out.push(`Total: ${money(t.total)}`);
  if (x) {
    x.deps.forEach(d => out.push(`Deposit received (${d.inv.num}): -${money(d.cents)}`));
    if (x.paid) out.push(`Paid: -${money(x.paid)}`);
    out.push(`Balance due: ${money(Math.max(0, x.bal))}`, '', `Pay by e-Transfer to ${s.etransfer}`);
    if (+s.lateRate > 0 && r.kind !== 'deposit') out.push(`Overdue balances are charged ${fmtRate(s.lateRate)}% per month.`);
  }
  if (type === 'quote') out.push('', 'Valid for 30 days. Reply to accept.');
  if (r.notes) out.push('', r.notes);
  if (s.hst) out.push('', `Tax reg. ${s.hst}`);
  return out.join('\n');
}
function reminderText(inv) {
  const s = db.settings, x = iInfo(inv), c = client(inv.clientId);
  const what = inv.title ? `for ${inv.title}` : '';
  const out = [`Hi ${c.name},`, ''];
  if (x.status === 'overdue') {
    out.push(`Invoice ${inv.num} ${what} was due on ${fmtLong(x.due)} and is now ${plural(x.daysOver, 'day')} past due. The balance owing is ${money(x.bal)}.`.replace('  ', ' '));
    if (+s.lateRate > 0 && inv.kind !== 'deposit') out.push('', `As per our terms, overdue balances are charged ${fmtRate(s.lateRate)}% per month.`);
  } else {
    out.push(`A friendly reminder that invoice ${inv.num} ${what} is due ${daysBetween(TODAY, x.due) === 0 ? 'today' : `on ${fmtLong(x.due)}`}. The balance is ${money(x.bal)}.`.replace('  ', ' '));
  }
  out.push('', `You can pay by e-Transfer to ${s.etransfer}. If you've already sent payment, thank you, and please ignore this note.`, '', s.name, s.phone);
  return out.join('\n');
}
function newQuote(clientId) {
  const q = {id:uid(), num:'Q-' + db.seq.q++, clientId, title:'', date:TODAY, status:'draft', items:[blankItem()], taxes:docTaxes(), discount:null, notes:'', jobId:null};
  db.quotes.push(q); save(); renderTabs(); renderView(); openSheet('quote', q.id);
  const t = $('#f-title'); if (t) t.focus();
  toast(`Started ${q.num}`);
}
function invoiceFromJob(j) {
  const inv = {id:uid(), num:'INV-' + db.seq.i++, kind:'standard', clientId:j.clientId, jobId:j.id, quoteId:j.quoteId || null, title:j.title, date:TODAY, dueDays:+db.settings.terms, sent:false, everSent:false, void:false,
    items:clone(j.items), taxes:taxesOf(j), discount:j.discount ? {...j.discount} : null, notes:'Thanks for your business.', payments:[], log:[ev(TODAY, `Created from ${j.num}`)]};
  db.invoices.filter(d => d.kind === 'deposit' && !d.void && !d.payments.length && ((inv.quoteId && d.quoteId === inv.quoteId) || d.jobId === j.id)).forEach(d => {
    d.void = true; d.log.push(ev(TODAY, `Voided: unpaid, replaced by ${inv.num}`)); inv.log.push(ev(TODAY, `Unpaid deposit ${d.num} voided`));
  });
  const deps = depositsFor(inv);
  if (deps.length) inv.log.push(ev(TODAY, `Deposit ${deps.map(d => d.inv.num).join(', ')} credited`));
  db.invoices.push(inv); j.invoiceId = inv.id; save(); renderTabs(); renderView(); openSheet('invoice', inv.id);
  toast(`${inv.num} drafted from ${j.num}${deps.length ? ', deposit credited' : ''}`);
}

document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) { const [t, id] = o.dataset.open.split(':'); openSheet(t, id); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  const rec = getRec();
  const type = state.sheet && state.sheet.type;
  const log = (r, text) => { (r.log = r.log || []).push(ev(TODAY, text)); };
  switch (act) {
    case 'close': closeSheet(); break;
    case 'settings': openSheet('settings', 'settings'); break;
    case 'print': window.print(); break;
    case 'filter': state.filters[a.dataset.view] = a.dataset.f; renderView(); break;
    case 'new-quote': {
      const cid = a.dataset.client || (db.clients[0] && db.clients[0].id);
      if (!cid) { toast('Add a client first'); break; }
      newQuote(cid); break;
    }
    case 'new-job': {
      if (!db.clients[0]) { toast('Add a client first'); break; }
      const j = {id:uid(), num:'J-' + db.seq.j++, clientId:db.clients[0].id, quoteId:null, title:'', date:rel(1), status:'scheduled', items:[blankItem()], taxes:docTaxes(), discount:null, checklist:[], notes:'', invoiceId:null};
      db.jobs.push(j); save(); renderTabs(); renderView(); openSheet('job', j.id); toast(`Booked ${j.num} for tomorrow`); break;
    }
    case 'new-invoice': {
      if (!db.clients[0]) { toast('Add a client first'); break; }
      const inv = {id:uid(), num:'INV-' + db.seq.i++, kind:'standard', clientId:db.clients[0].id, jobId:null, quoteId:null, title:'', date:TODAY, dueDays:+db.settings.terms, sent:false, everSent:false, void:false, items:[blankItem()], taxes:docTaxes(), discount:null, notes:'', payments:[], log:[ev(TODAY, 'Created')]};
      db.invoices.push(inv); save(); renderTabs(); renderView(); openSheet('invoice', inv.id); toast(`Started ${inv.num}`); break;
    }
    case 'new-client': {
      const c = {id:uid(), name:'', phone:'', email:'', address:''};
      db.clients.push(c); save();
      if (a.dataset.for) { const [t, id] = a.dataset.for.split(':'); state.returnTo = {type:t, id}; }
      openSheet('client', c.id); const n = $('#cl-name'); if (n) n.focus(); break;
    }
    case 'add-item': case 'add-preset': {
      if (!rec) break;
      const it = act === 'add-item' ? blankItem() : {...PRICEBOOK[+a.dataset.i], taxable:true, id:uid()};
      rec.items.push(it); commit();
      if (act === 'add-item') { const d = document.getElementById(`it-${it.id}-desc`); if (d) d.focus(); }
      else toast(`Added ${it.desc}`);
      break;
    }
    case 'rm-item': { const id = a.closest('[data-item]').dataset.item; rec.items = rec.items.filter(i => i.id !== id); commit(); break; }
    case 'q-send': rec.status = 'sent'; rec.sentOn = TODAY; commit(); toast(`${rec.num} marked as sent`); break;
    case 'q-accept': rec.status = 'accepted'; rec.acceptedOn = TODAY; commit(); toast(`${rec.num} accepted. Schedule the job or request a deposit.`); break;
    case 'q-decline': rec.status = 'declined'; commit(); toast(`${rec.num} marked as declined`); break;
    case 'q-draft': rec.status = 'draft'; delete rec.sentOn; delete rec.acceptedOn; commit(); toast(`${rec.num} is a draft again`); break;
    case 'q-schedule': {
      const q = a.dataset.id ? byId(db.quotes, a.dataset.id) : rec;
      const j = {id:uid(), num:'J-' + db.seq.j++, clientId:q.clientId, quoteId:q.id, title:q.title || 'Untitled job', date:rel(2), status:'scheduled', items:clone(q.items), taxes:taxesOf(q), discount:q.discount ? {...q.discount} : null,
        checklist:[{id:uid(), t:'Confirm date with client', done:false}, {id:uid(), t:'Order materials', done:false}], notes:'', invoiceId:null};
      db.jobs.push(j); q.jobId = j.id;
      db.invoices.forEach(d => { if (d.kind === 'deposit' && d.quoteId === q.id && !d.jobId) d.jobId = j.id; });
      save(); renderTabs(); renderView(); openSheet('job', j.id);
      toast(`${j.num} booked for ${fmtDate(j.date)}. Change the date if needed.`); break;
    }
    case 'deposit': {
      const src = rec, isQ = type === 'quote';
      const pct = +db.settings.depositPct;
      const amt = Math.round(totals(src).total * pct / 100);
      const inv = {id:uid(), num:'INV-' + db.seq.i++, kind:'deposit', clientId:src.clientId, quoteId:isQ ? src.id : (src.quoteId || null), jobId:isQ ? (src.jobId || null) : src.id,
        title:`Deposit · ${src.title || 'Untitled'}`, date:TODAY, dueDays:0, sent:false, everSent:false, void:false,
        items:[{id:uid(), desc:`Deposit (${fmtRate(pct)}%) for ${src.num}${src.title ? ' ' + src.title : ''}`, kind:'flat', qty:1, unit:'ea', rate:amt / 100, taxable:false}],
        taxes:taxesOf(src), discount:null, notes:'This deposit is credited in full on the final invoice.', payments:[], log:[ev(TODAY, `Requested from ${src.num}`)]};
      db.invoices.push(inv); save(); renderTabs(); renderView(); openSheet('invoice', inv.id);
      toast(`${inv.num} drafted for a ${money(amt)} deposit`); break;
    }
    case 'j-start': rec.status = 'in_progress'; if (daysBetween(TODAY, rec.date) > 0) rec.date = TODAY; commit(); toast(`${rec.num} is on site`); break;
    case 'j-done': rec.status = 'done'; if (daysBetween(TODAY, rec.date) > 0) rec.date = TODAY; rec.checklist.forEach(c => c.done = true); commit(); toast(`${rec.num} done. Ready to invoice.`); break;
    case 'j-reopen': rec.status = 'scheduled'; commit(); break;
    case 'j-invoice': { const j = a.dataset.id ? byId(db.jobs, a.dataset.id) : rec; if (j) invoiceFromJob(j); break; }
    case 'chk-add': { const inp = $('#chk-new'); const t = inp.value.trim(); if (!t) { inp.focus(); break; } rec.checklist.push({id:uid(), t, done:false}); commit(); const n = $('#chk-new'); if (n) n.focus(); break; }
    case 'chk-rm': rec.checklist = rec.checklist.filter(c => c.id !== a.dataset.id); commit(); break;
    case 'i-send': rec.sent = true; rec.everSent = true; rec.sentOn = TODAY; log(rec, 'Marked as sent'); commit(); toast(`${rec.num} marked as sent`); break;
    case 'i-draft': rec.sent = false; log(rec, 'Reopened for editing'); commit(); toast(`${rec.num} is a draft again`); break;
    case 'i-void': {
      if (rec.payments.length) { toast('Remove the payments before voiding'); break; }
      if (!arm(a, 'Tap again to void')) break;
      rec.void = true; log(rec, 'Voided');
      db.jobs.forEach(j => { if (j.invoiceId === rec.id) j.invoiceId = null; });
      commit(); toast(`${rec.num} voided. Its number stays on file.`); break;
    }
    case 'i-remind': {
      const inv = a.dataset.id ? byId(db.invoices, a.dataset.id) : rec;
      const od = iInfo(inv).status === 'overdue';
      copyText(reminderText(inv), `${od ? 'Overdue' : 'Friendly'} reminder for ${inv.num} copied. Paste it into an email or text.`);
      inv.lastReminder = TODAY; log(inv, `${od ? 'Overdue' : 'Friendly'} reminder sent`); commit(); break;
    }
    case 'i-latefee': {
      const x = iInfo(rec); const r = +db.settings.lateRate;
      const fee = Math.round(x.bal * r / 100);
      if (x.status !== 'overdue' || fee <= 0) break;
      rec.items.push({id:uid(), desc:`Late fee: ${fmtRate(r)}% of ${money(x.bal)} overdue`, kind:'flat', qty:1, unit:'ea', rate:fee / 100, taxable:false, fee:true, feeDate:TODAY});
      log(rec, `Late fee of ${money(fee)} added`); commit(); toast(`Late fee of ${money(fee)} added to ${rec.num}`); break;
    }
    case 'pay': case 'pay-full': {
      const x = iInfo(rec);
      const cents = act === 'pay-full' ? x.bal : Math.round((parseFloat($('#pay-amt').value) || 0) * 100);
      if (cents <= 0) { toast('Enter an amount above $0'); $('#pay-amt').focus(); break; }
      const method = act === 'pay-full' ? 'e-Transfer' : $('#pay-method').value;
      const date = act === 'pay-full' ? TODAY : ($('#pay-date').value || TODAY);
      rec.payments.push({id:uid(), date, cents, method});
      log(rec, `Payment of ${money(cents)} received by ${method}`);
      const after = iInfo(rec);
      if (after.status === 'paid') log(rec, 'Paid in full');
      commit();
      toast(after.status === 'paid' ? `${rec.num} is paid in full` : `${money(cents)} recorded. ${money(after.bal)} still owing.`); break;
    }
    case 'pay-rm': {
      const p = rec.payments.find(x => x.id === a.dataset.id); if (!p) break;
      rec.payments = rec.payments.filter(x => x !== p); log(rec, `Payment of ${money(p.cents)} removed`); commit(); toast('Payment removed'); break;
    }
    case 'del': {
      if (!arm(a, 'Tap again to delete')) break;
      const num = rec.num || rec.name || 'Client';
      if (type === 'job') { db.quotes.forEach(q => { if (q.jobId === rec.id) q.jobId = null; }); }
      if (type === 'invoice') { db.jobs.forEach(j => { if (j.invoiceId === rec.id) j.invoiceId = null; }); }
      db[COL[type]] = db[COL[type]].filter(x => x !== rec);
      state.sheet = null; state.returnTo = null; commit(); toast(`Deleted ${num}`); break;
    }
    case 'copy': copyText(a.dataset.text, a.dataset.what || 'Copied'); break;
    case 'copy-doc': copyText(docText(type, rec), `${rec.num} copied as text`); break;
    case 'copyfall-close': $('#copyfall').hidden = true; break;
    case 'reset': {
      if (!arm(a, 'Tap again to reset')) break;
      try { localStorage.removeItem(KEY); } catch (err) {}
      db = seed(); state.sheet = null; state.returnTo = null; renderAll(); toast('Sample data restored'); break;
    }
  }
});

document.addEventListener('input', e => {
  const t = e.target; const rec = getRec(); if (!rec) return;
  const refresh = () => { const box = $('#sheet [data-totals]'); if (box) box.innerHTML = totalsHTML(rec, state.sheet.type); };
  const row = t.closest('[data-item]');
  if (row && t.dataset.k) {
    const it = rec.items.find(i => i.id === row.dataset.item); if (!it) return;
    const k = t.dataset.k;
    if (k === 'taxable') it.taxable = t.checked;
    else it[k] = (k === 'qty' || k === 'rate') ? (parseFloat(t.value) || 0) : t.value;
    if (k === 'kind') { const u = row.querySelector('[data-k="unit"]'); const def = {labour:'hr', material:'ea', flat:'ea'}[t.value]; if (u && (!u.value || ['hr','ea'].includes(u.value))) { u.value = def; it.unit = def; } }
    row.querySelector('.amt').textContent = money(lineCents(it));
    refresh(); save(); return;
  }
  if (t.dataset.disc) {
    rec.discount = rec.discount || {mode:'pct', value:0};
    rec.discount[t.dataset.disc] = t.dataset.disc === 'value' ? (parseFloat(t.value) || 0) : t.value;
    refresh(); save(); return;
  }
  if (t.dataset.f) {
    let v = t.value;
    if (t.dataset.f === 'date' && !v) return;
    if (t.dataset.num !== undefined) v = Math.max(0, parseFloat(v) || 0);
    rec[t.dataset.f] = v; save();
    if (state.sheet.type === 'settings') renderHeader();
    if (t.dataset.rerender !== undefined) renderSheet();
    else if (state.sheet.type === 'client' && t.dataset.f === 'name') { const s = $('#sheet .sb-title span'); if (s) s.textContent = v || 'New client'; }
  }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset.chk) return;
  const rec = getRec(); const c = rec && rec.checklist.find(x => x.id === t.dataset.chk); if (!c) return;
  c.done = t.checked; commit();
  const again = document.getElementById(`ck-${c.id}`); if (again) again.focus({preventScroll:true});
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#copyfall').hidden) { $('#copyfall').hidden = true; return; } if (state.sheet) closeSheet(); }
  if (e.key === 'Enter' && e.target.id === 'chk-new') { e.preventDefault(); const b = $('#sheet [data-act="chk-add"]'); if (b) b.click(); }
});

function route() {
  const h = location.hash.slice(1);
  state.view = VIEWS[h] ? h : 'overview';
  renderTabs(); renderView();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
renderHeader();
route();
})();
</script>
